<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Network Lab — interactive missions in OVS/OVN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14;
  --bg-elev:#11151c;
  --bg-elev-2:#161c26;
  --panel:#0f141c;
  --line:#1f2937;
  --line-strong:#2a3645;
  --ink:#e7ecf1;
  --ink-soft:#a3b1c2;
  --ink-mute:#6b7a8d;
  --accent:#7df9b8;       /* mint green — terminal glow */
  --accent-2:#ffb849;     /* amber — TAP/components */
  --accent-3:#a78bfa;     /* purple — OVN logical layer */
  --accent-4:#5ec5ff;     /* blue — links/wires */
  --danger:#ff5d6c;
  --success:#7df9b8;
  --warning:#ffb849;
  --grid:rgba(255,255,255,.03);
  --grid-strong:rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(125,249,184,.06), transparent 60%),
    radial-gradient(ellipse 1000px 500px at 100% 20%, rgba(167,139,250,.05), transparent 60%),
    var(--bg);
}
a{color:var(--accent-4);text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.display{font-family:'Major Mono Display',monospace;letter-spacing:.02em;text-transform:lowercase}
h1,h2,h3{font-family:Sora,sans-serif;font-weight:600;letter-spacing:-0.015em;color:var(--ink);margin:0}
h1{font-size:2.6rem;line-height:1.05;font-weight:300}
h2{font-size:1.4rem;margin:1.5rem 0 .5rem}
h3{font-size:1rem;margin:1rem 0 .35rem}
p{margin:.7rem 0;color:var(--ink-soft)}
code{font-family:'Space Mono',monospace;font-size:.86em;background:#161c26;padding:.1em .35em;border-radius:3px;color:var(--accent);border:1px solid var(--line)}

/* ====== APP SHELL ====== */
.shell{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.topbar{
  display:flex;align-items:center;gap:1.25rem;padding:.85rem 1.5rem;
  background:linear-gradient(180deg,rgba(17,21,28,.92),rgba(17,21,28,.6));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:.6rem}
.logo-mark{
  width:32px;height:32px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),#39d191);
  display:grid;place-items:center;color:#0a0d12;font-family:'Major Mono Display',monospace;
  font-weight:700;font-size:1rem;box-shadow:0 0 24px rgba(125,249,184,.3);
}
.logo-text{font-family:'Major Mono Display',monospace;font-size:1.1rem;color:var(--ink);letter-spacing:.06em}
.logo-text small{color:var(--ink-mute);font-size:.6rem;display:block;margin-top:-2px;letter-spacing:.18em;text-transform:uppercase;font-family:Sora,sans-serif;font-weight:500}

.mission-tabs{display:flex;gap:.3rem;overflow-x:auto;flex:1;padding-bottom:0;scrollbar-width:none}
.mission-tabs::-webkit-scrollbar{display:none}
.tab{
  background:transparent;border:1px solid var(--line);color:var(--ink-mute);
  padding:.4rem .7rem;border-radius:6px;font-family:'Space Mono',monospace;
  font-size:.7rem;cursor:pointer;white-space:nowrap;transition:all .15s;
  display:inline-flex;align-items:center;gap:.4rem;font-weight:400;
}
.tab:hover{border-color:var(--line-strong);color:var(--ink-soft)}
.tab.active{background:rgba(125,249,184,.08);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px rgba(125,249,184,.2),0 0 12px rgba(125,249,184,.1)}
.tab.done{color:var(--accent);border-color:rgba(125,249,184,.3)}
.tab .num{
  font-family:'Major Mono Display',monospace;font-size:.78rem;
  min-width:1.2em;text-align:center;
}
.tab.done .num::after{content:'✓';margin-left:.2em;color:var(--accent)}

.progress-pill{
  margin-left:auto;display:flex;align-items:center;gap:.5rem;
  font-family:'Space Mono',monospace;font-size:.72rem;color:var(--ink-mute);
  padding:.3rem .7rem;border:1px solid var(--line);border-radius:99px;
  background:var(--bg-elev);
}
.progress-pill strong{color:var(--accent);font-weight:400}

/* ====== MISSION LAYOUT ====== */
.mission{
  display:grid;
  grid-template-columns: 280px 1fr 340px;
  grid-template-rows: auto 1fr;
  gap:1px;
  background:var(--line);
  min-height:calc(100vh - 60px);
}
.mission > div{background:var(--bg)}

/* mission header spans full width */
.mission-head{
  grid-column:1 / -1;
  padding:1.6rem 2rem 1.3rem;
  background:linear-gradient(180deg,var(--bg-elev) 0%, var(--bg) 100%);
  border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:1rem;
}
.mission-meta{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.mission-meta .badge{
  font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);
  border:1px solid rgba(125,249,184,.3);background:rgba(125,249,184,.05);
  padding:.2rem .55rem;border-radius:99px;
}
.mission-meta .tier{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-mute);letter-spacing:.06em}
.mission-head h1{margin:0;font-size:2rem;font-weight:300}
.mission-head .lede{color:var(--ink-soft);max-width:60ch;margin-top:.4rem;font-size:.95rem}
.mission-actions{display:flex;gap:.6rem;align-items:center}

.btn{
  border:1px solid var(--line-strong);background:var(--bg-elev);color:var(--ink);
  padding:.55rem 1rem;border-radius:6px;font-family:Sora,sans-serif;font-size:.85rem;
  font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.4rem;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#0a0d12;border-color:var(--accent);font-weight:600}
.btn-primary:hover{background:#9affc8;color:#0a0d12;box-shadow:0 0 20px rgba(125,249,184,.3)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{background:var(--bg-elev);border-color:var(--line-strong);color:var(--ink)}
.btn .kbd{font-family:'Space Mono',monospace;font-size:.7em;background:rgba(0,0,0,.2);padding:1px 5px;border-radius:3px;margin-left:.3rem}

/* ====== LEFT: PALETTE ====== */
.palette{
  padding:1.25rem 1.1rem;background:var(--panel);overflow-y:auto;
  display:flex;flex-direction:column;gap:1rem;
}
.panel-title{
  font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-mute);font-weight:400;
  display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;
}
.panel-title::before{content:'';width:18px;height:1px;background:var(--line-strong)}
.palette-group{margin-bottom:.4rem}
.palette-group h4{
  font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-mute);font-weight:400;margin:0 0 .5rem;padding-left:.3rem;
}
.piece{
  background:var(--bg-elev);border:1px solid var(--line-strong);border-radius:7px;
  padding:.55rem .7rem;cursor:grab;user-select:none;
  display:flex;align-items:center;gap:.55rem;margin-bottom:.4rem;
  transition:all .12s;position:relative;
}
.piece:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.piece:active{cursor:grabbing;transform:scale(.98)}
.piece.dragging{opacity:.5}
.piece.used{opacity:.3;cursor:not-allowed;pointer-events:none}
.piece.used::after{content:'placed';font-family:'Space Mono',monospace;font-size:.6rem;color:var(--accent);position:absolute;right:.5rem;top:50%;transform:translateY(-50%)}
.piece-icon{
  width:32px;height:32px;border-radius:5px;flex-shrink:0;
  display:grid;place-items:center;font-family:'Major Mono Display',monospace;font-size:.85rem;
  border:1px solid var(--line-strong);
}
.piece-icon.ns{background:#1c2330;border-color:#2d3d52;color:var(--accent-4)}
.piece-icon.tap{background:#2a1f10;border-color:#3d2d18;color:var(--accent-2)}
.piece-icon.veth{background:#1c2a26;border-color:#2a3d36;color:var(--accent)}
.piece-icon.ovs{background:#1f1d33;border-color:#2e2c4a;color:var(--accent-3)}
.piece-icon.ovn{background:#2a1e3a;border-color:#3d2b51;color:var(--accent-3)}
.piece-icon.host{background:#1a1a1a;border-color:#2a2a2a;color:var(--ink-soft)}
.piece-icon.tunnel{background:#2d2718;border-color:#3d3422;color:var(--accent-2)}
.piece-icon.acl{background:#2a1517;border-color:#3d2024;color:var(--danger)}
.piece-icon.router{background:#1a1f2e;border-color:#28304a;color:var(--accent-4)}
.piece-icon.flow{background:#1c2a26;border-color:#2a3d36;color:var(--accent)}
.piece-name{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--ink);font-weight:700}
.piece-desc{font-family:Sora,sans-serif;font-size:.66rem;color:var(--ink-mute);margin-top:1px;line-height:1.3}
.piece-meta{margin-left:auto;font-family:'Space Mono',monospace;font-size:.6rem;color:var(--ink-mute);opacity:.6}

/* ====== MIDDLE: CANVAS ====== */
.canvas-wrap{
  position:relative;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(circle at 50% 50%, rgba(125,249,184,.02), transparent 60%),
    var(--bg);
  background-size:24px 24px,24px 24px,100% 100%,100% 100%;
  overflow:hidden;
}
.canvas-toolbar{
  position:absolute;top:.85rem;left:.85rem;right:.85rem;z-index:5;
  display:flex;align-items:center;gap:.5rem;pointer-events:none;
}
.canvas-toolbar .left,.canvas-toolbar .right{display:flex;gap:.5rem;align-items:center;pointer-events:auto}
.canvas-toolbar .right{margin-left:auto}
.canvas-status{
  font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-mute);
  padding:.35rem .6rem;background:rgba(15,20,28,.85);border:1px solid var(--line);
  border-radius:5px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:.45rem;
}
.canvas-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-mute)}
.canvas-status.live .dot{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.6s ease infinite}
.canvas-status.win .dot{background:var(--accent)}
.canvas-status.fail .dot{background:var(--danger)}
.canvas-status.win{color:var(--accent);border-color:rgba(125,249,184,.3)}
.canvas-status.fail{color:var(--danger);border-color:rgba(255,93,108,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.canvas{position:absolute;inset:0;cursor:default}
.canvas.dragover{background:radial-gradient(circle at center,rgba(125,249,184,.08),transparent 50%)}

/* host bezel — the "outer enclosure" */
.host-bezel{
  position:absolute;inset:60px 30px 30px;border:1.5px solid var(--line-strong);
  border-radius:14px;background:rgba(255,255,255,.01);
  box-shadow:inset 0 0 60px rgba(0,0,0,.3);pointer-events:none;
}
.host-bezel-label{
  position:absolute;top:-9px;left:18px;background:var(--bg);
  padding:0 .55rem;font-family:'Space Mono',monospace;font-size:.65rem;
  color:var(--ink-mute);letter-spacing:.14em;text-transform:uppercase;
}

.dropzone{
  position:absolute;border:1.5px dashed var(--line-strong);border-radius:10px;
  display:grid;place-items:center;color:var(--ink-mute);
  font-family:'Space Mono',monospace;font-size:.72rem;text-align:center;padding:.5rem;
  transition:all .15s;background:rgba(15,20,28,.4);
  min-width:160px;min-height:90px;
}
.dropzone-label{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--ink-mute);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2rem}
.dropzone-hint{font-family:Sora,sans-serif;font-size:.74rem;color:var(--ink-mute);font-weight:400}
.dropzone.target{border-color:var(--accent);background:rgba(125,249,184,.05);box-shadow:0 0 20px rgba(125,249,184,.1)}
.dropzone.target .dropzone-label{color:var(--accent)}
.dropzone.invalid{border-color:var(--danger);background:rgba(255,93,108,.05)}

.placed{
  position:absolute;background:var(--bg-elev);border:1.5px solid var(--line-strong);
  border-radius:9px;padding:.5rem .7rem;min-width:140px;
  box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:default;transition:transform .15s, box-shadow .15s;
  z-index:2;
}
.placed.namespace{border-color:var(--accent-4);background:linear-gradient(180deg,#1c2330,#161c26)}
.placed.tap{border-color:var(--accent-2);background:linear-gradient(180deg,#2a1f10,#1f1810)}
.placed.veth-end{border-color:var(--accent);background:linear-gradient(180deg,#1c2a26,#162520)}
.placed.bridge{border-color:var(--accent-3);background:linear-gradient(180deg,#1f1d33,#181628);min-width:220px}
.placed.lswitch{border-color:var(--accent-3);background:linear-gradient(180deg,#2a1e3a,#1f152e)}
.placed.lrouter{border-color:var(--accent-4);background:linear-gradient(180deg,#1a1f2e,#141826)}
.placed.flow{border-color:var(--accent);background:linear-gradient(180deg,#1c2a26,#162520);min-width:280px}
.placed.tunnel{border-color:var(--accent-2);background:linear-gradient(180deg,#2d2718,#1f1c10)}
.placed.glow{box-shadow:0 0 18px rgba(125,249,184,.4),0 4px 14px rgba(0,0,0,.3)}
.placed-head{display:flex;align-items:center;gap:.4rem;margin-bottom:.15rem}
.placed-name{font-family:'Space Mono',monospace;font-size:.72rem;font-weight:700;color:var(--ink)}
.placed-type{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--ink-mute);letter-spacing:.08em;text-transform:uppercase;margin-left:auto}
.placed-ip{font-family:'Space Mono',monospace;font-size:.66rem;color:var(--ink-soft);margin-top:.15rem}
.placed-children{margin-top:.45rem;display:flex;flex-direction:column;gap:.3rem;padding-left:.2rem;border-left:1px dashed var(--line)}
.placed-child{
  font-family:'Space Mono',monospace;font-size:.66rem;color:var(--ink-soft);
  padding:.25rem .4rem;background:rgba(0,0,0,.2);border-radius:4px;display:flex;align-items:center;gap:.35rem;
}
.placed-child .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.placed-port{
  font-family:'Space Mono',monospace;font-size:.62rem;color:var(--ink-mute);
  padding:.15rem .35rem;background:rgba(0,0,0,.25);border-radius:3px;
}
.placed-remove{
  position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:4px;
  background:transparent;border:none;color:var(--ink-mute);cursor:pointer;
  font-family:'Space Mono',monospace;font-size:.78rem;display:grid;place-items:center;
  opacity:0;transition:opacity .15s;
}
.placed:hover .placed-remove{opacity:1}
.placed-remove:hover{color:var(--danger);background:rgba(255,93,108,.1)}

.wires-svg{position:absolute;inset:0;pointer-events:none;z-index:1}
.wire{stroke:var(--accent-4);stroke-width:2;fill:none;opacity:.7}
.wire.active{stroke:var(--accent);animation:wireflow 1.5s linear infinite;stroke-dasharray:6 4}
.wire.danger{stroke:var(--danger)}
@keyframes wireflow{to{stroke-dashoffset:-20}}
.wire-port{
  position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg);
  border:2px solid var(--accent-4);cursor:crosshair;z-index:3;transition:all .15s;
}
.wire-port:hover{transform:scale(1.4);box-shadow:0 0 12px var(--accent-4)}
.wire-port.connected{background:var(--accent-4)}
.wire-temp{stroke:var(--accent-4);stroke-width:2;stroke-dasharray:4 4;fill:none;opacity:.6}

/* flow rule cards (mission "priority trap" / "drop rule") */
.flow-rule{
  font-family:'Space Mono',monospace;font-size:.7rem;background:var(--bg-elev);
  border:1px solid var(--line-strong);border-radius:6px;padding:.4rem .55rem;
  display:flex;align-items:center;gap:.4rem;cursor:grab;user-select:none;color:var(--ink-soft);
  transition:all .15s;
}
.flow-rule:hover{border-color:var(--accent);transform:translateX(2px)}
.flow-rule:active{cursor:grabbing}
.flow-rule .pri{
  background:rgba(125,249,184,.15);color:var(--accent);
  padding:1px 5px;border-radius:3px;font-size:.65rem;font-weight:700;
}
.flow-rule .arrow{color:var(--ink-mute)}
.flow-rule .act{color:var(--accent-2)}
.flow-rule .act.drop{color:var(--danger)}

/* ====== RIGHT: TERMINAL ====== */
.right-panel{
  background:#080b10;display:flex;flex-direction:column;overflow:hidden;
}
.term-head{
  padding:.6rem .85rem;background:#0b0e14;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.5rem;
}
.term-dots{display:flex;gap:5px}
.term-dot{width:9px;height:9px;border-radius:50%}
.term-dot.r{background:#ff5d6c}.term-dot.y{background:#ffb849}.term-dot.g{background:#7df9b8}
.term-title{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-mute);flex:1}
.term-copy{background:transparent;border:1px solid var(--line);color:var(--ink-mute);font-family:'Space Mono',monospace;font-size:.65rem;padding:.2rem .5rem;border-radius:4px;cursor:pointer}
.term-copy:hover{color:var(--accent);border-color:var(--accent)}
.term-body{
  flex:1;overflow-y:auto;padding:.85rem 1rem;font-family:'Space Mono',monospace;
  font-size:.78rem;line-height:1.6;color:var(--ink-soft);
}
.term-line{margin:0;white-space:pre-wrap;word-break:break-all;animation:termIn .25s ease}
.term-line .prompt{color:var(--accent);user-select:none}
.term-line.action{color:var(--ink-mute);font-style:italic;font-size:.72rem}
.term-line.output{color:var(--ink-soft);padding-left:0}
.term-line.success{color:var(--accent)}
.term-line.error{color:var(--danger)}
.term-line.divider{color:var(--ink-mute);border-top:1px dashed var(--line);margin-top:.6rem;padding-top:.6rem;font-size:.7rem}
@keyframes termIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

.brief-panel{
  border-top:1px solid var(--line);padding:1rem 1.1rem;
  background:linear-gradient(180deg,rgba(125,249,184,.04),transparent);
  max-height:42vh;overflow-y:auto;
}
.brief-step{
  display:flex;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--line);
  font-size:.82rem;color:var(--ink-soft);align-items:flex-start;
}
.brief-step:last-child{border-bottom:none}
.brief-step .step-num{
  font-family:'Space Mono',monospace;font-size:.65rem;color:var(--ink-mute);
  border:1px solid var(--line);width:18px;height:18px;border-radius:4px;
  display:grid;place-items:center;flex-shrink:0;margin-top:1px;
}
.brief-step.done .step-num{background:rgba(125,249,184,.15);color:var(--accent);border-color:rgba(125,249,184,.3)}
.brief-step.done{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:rgba(125,249,184,.4);text-decoration-thickness:1px}

.outcome{margin-top:.7rem;padding:.7rem .85rem;border-radius:6px;font-size:.82rem;line-height:1.5}
.outcome.win{background:rgba(125,249,184,.08);border:1px solid rgba(125,249,184,.25);color:var(--accent)}
.outcome.fail{background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.25);color:var(--danger)}
.outcome strong{font-weight:600}

/* ====== HOME SCREEN ====== */
.home{padding:3rem 2rem;max-width:1200px;margin:0 auto}
.home-hero{margin-bottom:3rem}
.home-eyebrow{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:1rem}
.home-hero h1{font-family:'Major Mono Display',monospace;font-size:4.5rem;line-height:.92;letter-spacing:-.01em;color:var(--ink);font-weight:400;margin-bottom:1.2rem;text-transform:lowercase}
.home-hero h1 span{color:var(--accent)}
.home-hero .home-lede{font-size:1.15rem;color:var(--ink-soft);max-width:60ch}
.home-cta{display:flex;gap:.8rem;margin-top:1.8rem}

.mission-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:1.5rem}
.mission-card{
  background:var(--bg);padding:1.25rem 1.3rem;cursor:pointer;transition:background .15s;
  border-left:2px solid transparent;position:relative;
}
.mission-card:hover{background:var(--bg-elev)}
.mission-card.done{border-left-color:var(--accent)}
.mission-card .mc-num{
  font-family:'Major Mono Display',monospace;font-size:.78rem;color:var(--ink-mute);
}
.mission-card.done .mc-num{color:var(--accent)}
.mission-card h3{font-size:1.05rem;font-weight:500;margin:.3rem 0 .35rem}
.mission-card p{font-size:.82rem;color:var(--ink-mute);margin:0;line-height:1.45}
.mission-card .mc-foot{
  margin-top:.7rem;display:flex;gap:.6rem;align-items:center;
  font-family:'Space Mono',monospace;font-size:.62rem;color:var(--ink-mute);
  letter-spacing:.06em;text-transform:uppercase;
}
.mission-card .mc-foot .tag{padding:.15rem .4rem;border:1px solid var(--line-strong);border-radius:3px}
.mission-card .mc-check{
  position:absolute;top:1.2rem;right:1.2rem;width:18px;height:18px;border-radius:50%;
  border:1px solid var(--line-strong);display:none;font-size:.7rem;
}
.mission-card.done .mc-check{
  display:grid;place-items:center;background:var(--accent);color:#0a0d12;border-color:var(--accent);
}
.mission-card .mc-check::after{content:'✓'}

.home-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem}
.tier-card{
  border:1px solid var(--line);border-radius:8px;padding:1.3rem;
  background:linear-gradient(180deg,var(--bg-elev),var(--bg));
}
.tier-card h4{font-family:'Major Mono Display',monospace;font-size:.95rem;color:var(--accent);margin:0 0 .4rem;text-transform:lowercase;font-weight:400;letter-spacing:.02em}
.tier-card p{margin:0;font-size:.82rem;color:var(--ink-mute);line-height:1.5}
.tier-card.t1 h4{color:var(--accent-4)}
.tier-card.t2 h4{color:var(--accent-3)}
.tier-card.t3 h4{color:var(--accent-2)}

/* ====== MODAL / OVERLAY ====== */
.celebrate{
  position:fixed;inset:0;background:rgba(8,11,16,.85);backdrop-filter:blur(8px);
  z-index:100;display:grid;place-items:center;animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.celebrate-card{
  background:var(--bg-elev);border:1px solid var(--accent);border-radius:14px;
  padding:2.5rem 3rem;max-width:520px;text-align:center;
  box-shadow:0 0 60px rgba(125,249,184,.15);position:relative;
}
.celebrate-icon{font-family:'Major Mono Display',monospace;font-size:3rem;color:var(--accent);margin-bottom:.5rem}
.celebrate h2{font-size:1.6rem;margin:.5rem 0;font-weight:500}
.celebrate p{color:var(--ink-soft);font-size:.95rem;margin-bottom:1.5rem}
.celebrate-actions{display:flex;gap:.6rem;justify-content:center}

/* ====== KNOB / CONNECTION HINT ====== */
.connection-mode{
  position:absolute;bottom:.85rem;left:50%;transform:translateX(-50%);z-index:5;
  font-family:'Space Mono',monospace;font-size:.75rem;color:var(--ink);
  padding:.5rem .85rem;background:rgba(11,14,20,.95);border:1px solid var(--accent);
  border-radius:6px;display:flex;align-items:center;gap:.6rem;
  box-shadow:0 0 20px rgba(125,249,184,.15);
}
.connection-mode .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1s ease infinite}

/* matching mission (capstone) */
.match-board{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;padding:1.5rem;height:100%;align-content:start}
.match-col h3{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);font-weight:400;margin-bottom:.8rem}
.match-card{
  background:var(--bg-elev);border:1px solid var(--line-strong);border-radius:7px;
  padding:.7rem .85rem;margin-bottom:.6rem;cursor:grab;user-select:none;
  font-family:'Space Mono',monospace;font-size:.78rem;color:var(--ink);
  transition:all .15s;
}
.match-card:active{cursor:grabbing}
.match-card.matched{border-color:var(--accent);background:rgba(125,249,184,.05);opacity:.6}
.match-slot{
  border:1.5px dashed var(--line-strong);border-radius:7px;padding:.7rem .85rem;
  margin-bottom:.6rem;min-height:48px;font-family:'Space Mono',monospace;
  font-size:.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:.6rem;
}
.match-slot.target{border-color:var(--accent);background:rgba(125,249,184,.04)}
.match-slot.filled{border-style:solid;border-color:var(--accent);background:var(--bg-elev)}
.match-slot.wrong{border-color:var(--danger);background:rgba(255,93,108,.05)}
.match-slot-label{color:var(--ink-mute);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}

/* responsive */
@media (max-width:1100px){
  .mission{grid-template-columns:240px 1fr 300px}
  .home-hero h1{font-size:3rem}
  .home-tiers{grid-template-columns:1fr}
}
@media (max-width:820px){
  .mission{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .palette{max-height:200px}
  .right-panel{max-height:280px}
}

/* small touches */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-mute)}
::selection{background:rgba(125,249,184,.25);color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   PIECE DEFINITIONS — what can be dragged from palette
   ============================================================ */

const PIECE_TYPES = {
  namespace: {
    label: 'namespace',
    desc: 'isolated network stack',
    icon: 'NS',
    iconClass: 'ns',
    cmd: (props) => `sudo ip netns add ${props.name}`,
  },
  tap: {
    label: 'TAP device',
    desc: 'L2 virtual NIC',
    icon: 'TAP',
    iconClass: 'tap',
    cmd: (props) => `sudo ip tuntap add dev ${props.name} mode tap`,
  },
  veth: {
    label: 'veth pair',
    desc: 'virtual crossover cable',
    icon: 'VTH',
    iconClass: 'veth',
    cmd: (props) => `sudo ip link add ${props.a} type veth peer name ${props.b}`,
  },
  bridge: {
    label: 'OVS bridge',
    desc: 'L2 software switch',
    icon: 'BR',
    iconClass: 'ovs',
    cmd: (props) => `sudo ovs-vsctl add-br ${props.name}\nsudo ip link set ${props.name} up`,
  },
  lswitch: {
    label: 'logical switch',
    desc: 'OVN virtual network',
    icon: 'LS',
    iconClass: 'ovn',
    cmd: (props) => `ovn-nbctl ls-add ${props.name}`,
  },
  lrouter: {
    label: 'logical router',
    desc: 'OVN L3 router',
    icon: 'LR',
    iconClass: 'router',
    cmd: (props) => `ovn-nbctl lr-add ${props.name}`,
  },
  tunnel: {
    label: 'VXLAN port',
    desc: 'overlay tunnel endpoint',
    icon: 'VX',
    iconClass: 'tunnel',
    cmd: (props) => `sudo ovs-vsctl add-port ${props.bridge} ${props.name} \\\n  -- set interface ${props.name} type=vxlan \\\n     options:remote_ip=${props.remote} \\\n     options:key=${props.vni}`,
  },
  flow: {
    label: 'flow rule',
    desc: 'OpenFlow rule',
    icon: 'FL',
    iconClass: 'flow',
    cmd: (props) => `sudo ovs-ofctl add-flow ${props.bridge} \\\n  "priority=${props.priority},${props.match},actions=${props.action}"`,
  },
  acl: {
    label: 'ACL rule',
    desc: 'OVN security rule',
    icon: 'AC',
    iconClass: 'acl',
    cmd: (props) => `ovn-nbctl acl-add ${props.ls} ${props.dir} ${props.priority} '${props.match}' ${props.action}`,
  },
};

/* ============================================================
   COMMAND LOG HOOK
   ============================================================ */
function useTerminal(initial = []) {
  const [lines, setLines] = useState(initial);
  const add = useCallback((line, type='cmd') => {
    setLines(prev => [...prev, { text: line, type, id: Date.now() + Math.random() }]);
  }, []);
  const addCmd = useCallback((cmd) => {
    cmd.split('\n').forEach((l, i) => {
      setLines(prev => [...prev, { text: l, type: 'cmd', id: Date.now() + Math.random() + i, first: i === 0 }]);
    });
  }, []);
  const addOutput = useCallback((line) => add(line, 'output'), [add]);
  const addAction = useCallback((line) => add(line, 'action'), [add]);
  const addDivider = useCallback((line) => add(line, 'divider'), [add]);
  const clear = useCallback(() => setLines([]), []);
  const reset = useCallback((newLines = []) => setLines(newLines), []);
  return { lines, add, addCmd, addOutput, addAction, addDivider, clear, reset };
}

/* ============================================================
   TERMINAL VIEW
   ============================================================ */
function Terminal({ lines, onCopy }) {
  const bodyRef = useRef(null);
  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [lines]);
  
  const copyAll = () => {
    const txt = lines.filter(l => l.type === 'cmd').map(l => l.text).join('\n');
    navigator.clipboard.writeText(txt).then(() => onCopy && onCopy());
  };
  
  return (
    <>
      <div className="term-head">
        <div className="term-dots"><span className="term-dot r"/><span className="term-dot y"/><span className="term-dot g"/></div>
        <div className="term-title">~/lab — generated commands</div>
        <button className="term-copy" onClick={copyAll}>copy all</button>
      </div>
      <div className="term-body" ref={bodyRef}>
        {lines.length === 0 && <div className="term-line action">// commands will appear here as you build</div>}
        {lines.map(l => {
          if (l.type === 'cmd') return <div key={l.id} className="term-line">{l.first !== false && <span className="prompt">$ </span>}{l.text}</div>;
          if (l.type === 'output') return <div key={l.id} className="term-line output">{l.text}</div>;
          if (l.type === 'action') return <div key={l.id} className="term-line action">// {l.text}</div>;
          if (l.type === 'success') return <div key={l.id} className="term-line success">✓ {l.text}</div>;
          if (l.type === 'error') return <div key={l.id} className="term-line error">✗ {l.text}</div>;
          if (l.type === 'divider') return <div key={l.id} className="term-line divider">{l.text}</div>;
          return <div key={l.id} className="term-line">{l.text}</div>;
        })}
      </div>
    </>
  );
}

/* ============================================================
   DRAGGABLE PIECE (from palette)
   ============================================================ */
function PalettePiece({ piece, used, onDragStart, onDragEnd }) {
  const type = PIECE_TYPES[piece.type];
  if (!type) return null;
  return (
    <div
      className={`piece ${used ? 'used' : ''}`}
      draggable={!used}
      onDragStart={(e) => {
        e.dataTransfer.setData('application/json', JSON.stringify(piece));
        e.dataTransfer.effectAllowed = 'copy';
        onDragStart && onDragStart(piece);
      }}
      onDragEnd={onDragEnd}
    >
      <div className={`piece-icon ${type.iconClass}`}>{type.icon}</div>
      <div>
        <div className="piece-name">{piece.label || piece.name}</div>
        <div className="piece-desc">{piece.desc || type.desc}</div>
      </div>
      {piece.meta && <div className="piece-meta">{piece.meta}</div>}
    </div>
  );
}

/* ============================================================
   PLACED PIECE (rendered on canvas)
   ============================================================ */
function PlacedPiece({ item, onRemove, onPortClick, connecting, children }) {
  return (
    <div
      className={`placed ${item.type} ${item.glow ? 'glow' : ''}`}
      style={{ left: item.x, top: item.y, width: item.w, height: item.h }}
    >
      <button className="placed-remove" onClick={() => onRemove && onRemove(item.id)} aria-label="remove">×</button>
      <div className="placed-head">
        <span className="placed-name">{item.name}</span>
        <span className="placed-type">{item.subtype || item.type}</span>
      </div>
      {item.ip && <div className="placed-ip">{item.ip}</div>}
      {item.subtitle && <div className="placed-ip" style={{color:'var(--ink-mute)'}}>{item.subtitle}</div>}
      {item.contents && item.contents.length > 0 && (
        <div className="placed-children">
          {item.contents.map((c, i) => (
            <div key={i} className="placed-child"><span className="dot"/>{c}</div>
          ))}
        </div>
      )}
      {children}
    </div>
  );
}

/* ============================================================
   MISSION DEFINITIONS
   Each mission has its own custom canvas/interaction model.
   ============================================================ */

/* ---------- Mission 1: First Isolation ---------- */
function Mission1({ onComplete, reset, term }) {
  const [zones, setZones] = useState({ red: null, blue: null });
  const [palette, setPalette] = useState([
    { type:'namespace', name:'ns-red', label:'ns-red', desc:'first network namespace' },
    { type:'namespace', name:'ns-blue', label:'ns-blue', desc:'second network namespace' },
  ]);
  const [verifyState, setVerifyState] = useState('idle');
  
  useEffect(() => { setZones({red:null,blue:null}); setVerifyState('idle'); term.reset([{text:'sandbox ready. drag the two namespace pieces onto their slots.', type:'action', id:Math.random()}]); }, [reset]);
  
  const handleDrop = (slot, e) => {
    e.preventDefault();
    const data = e.dataTransfer.getData('application/json');
    if (!data) return;
    const piece = JSON.parse(data);
    if (slot === 'red' && piece.name !== 'ns-red') return;
    if (slot === 'blue' && piece.name !== 'ns-blue') return;
    setZones(z => ({ ...z, [slot]: piece }));
    term.addAction(`dropped ${piece.name} into host slot`);
    term.addCmd(PIECE_TYPES.namespace.cmd(piece));
    term.addOutput(`(namespace created, empty stack, lo is DOWN)`);
  };
  
  const allowDrop = (e) => e.preventDefault();
  
  const tryPing = () => {
    if (!zones.red || !zones.blue) {
      setVerifyState('fail');
      return;
    }
    term.addDivider('attempting ping from ns-red to a hypothetical 10.0.2.1...');
    term.addCmd('sudo ip netns exec ns-red ping -c 2 10.0.2.1');
    term.addOutput('PING 10.0.2.1 (10.0.2.1) 56(84) bytes of data.');
    term.addOutput('ping: connect: Network is unreachable');
    term.addOutput('');
    term.addOutput('--- 10.0.2.1 ping statistics ---');
    term.addOutput('2 packets transmitted, 0 received, 100% packet loss');
    term.add('isolation verified — namespaces have no routes, no links, no neighbours. Mission complete.', 'success');
    setVerifyState('win');
    onComplete && onComplete();
  };
  
  const usedNames = new Set([zones.red?.name, zones.blue?.name].filter(Boolean));
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>Network namespaces</h4>
          {palette.map(p => <PalettePiece key={p.name} piece={p} used={usedNames.has(p.name)} />)}
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            A namespace is a fresh, empty copy of the kernel's network stack: no interfaces, no routes, no ARP, no iptables. Two of them on the same host are like two isolated rooms.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${verifyState === 'win' ? 'win' : verifyState === 'fail' ? 'fail' : 'live'}`}>
              <span className="dot"/>
              {verifyState === 'win' ? 'isolation verified' : verifyState === 'fail' ? 'place both namespaces' : 'building...'}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" disabled={!zones.red || !zones.blue || verifyState === 'win'} onClick={tryPing}>verify isolation →</button>
          </div>
        </div>
        <div className="host-bezel"><span className="host-bezel-label">host — root namespace</span></div>
        <div
          className={`dropzone ${zones.red ? '' : 'target'}`}
          style={{ left:'10%', top:'30%', width:'34%', height:'36%' }}
          onDragOver={allowDrop} onDrop={e => handleDrop('red', e)}
        >
          {zones.red ? (
            <PlacedPiece item={{...zones.red, x:0, y:0, w:'100%', h:'100%', subtype:'netns', contents:['lo (DOWN)']}}/>
          ) : (
            <>
              <div className="dropzone-label">slot · ns-red</div>
              <div className="dropzone-hint">drop the ns-red namespace here</div>
            </>
          )}
        </div>
        <div
          className={`dropzone ${zones.blue ? '' : 'target'}`}
          style={{ left:'56%', top:'30%', width:'34%', height:'36%' }}
          onDragOver={allowDrop} onDrop={e => handleDrop('blue', e)}
        >
          {zones.blue ? (
            <PlacedPiece item={{...zones.blue, x:0, y:0, w:'100%', h:'100%', subtype:'netns', contents:['lo (DOWN)']}}/>
          ) : (
            <>
              <div className="dropzone-label">slot · ns-blue</div>
              <div className="dropzone-hint">drop the ns-blue namespace here</div>
            </>
          )}
        </div>
        {verifyState === 'win' && (
          <div className="connection-mode"><span className="pulse"/>they're isolated. nothing connects them — yet.</div>
        )}
      </div>
    </>
  );
}

/* ---------- Mission 2: Plug In a TAP ---------- */
function Mission2({ onComplete, reset, term }) {
  const [stage, setStage] = useState(0); // 0:empty, 1:tap-on-host, 2:tap-in-ns, 3:ip-set, 4:done
  const [tapPlaced, setTapPlaced] = useState(false);
  const [tapInNs, setTapInNs] = useState(false);
  const [ipAssigned, setIpAssigned] = useState(false);
  
  useEffect(() => {
    setStage(0); setTapPlaced(false); setTapInNs(false); setIpAssigned(false);
    term.reset([{text:'mission 2: build a TAP device, move it into ns-red, assign an IP.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const handleHostDrop = (e) => {
    e.preventDefault();
    if (tapPlaced) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.type !== 'tap') return;
    setTapPlaced(true);
    term.addAction('dropped tap-red on host');
    term.addCmd(PIECE_TYPES.tap.cmd({ name: 'tap-red' }));
    term.addOutput('(default state: DOWN, no IP, no namespace)');
  };
  
  const handleNsDrop = (e) => {
    e.preventDefault();
    if (!tapPlaced || tapInNs) return;
    const data = e.dataTransfer.getData('application/json');
    if (!data) return;
    const piece = JSON.parse(data);
    if (piece.type !== 'tap') return;
    setTapInNs(true);
    term.addAction('moved tap-red from host into ns-red');
    term.addCmd('sudo ip link set tap-red netns ns-red');
    term.addCmd('sudo ip link show tap-red');
    term.add('Device "tap-red" does not exist.', 'error');
    term.addOutput('(it disappeared from the host because it lives in ns-red now)');
  };
  
  const handleAssignIp = () => {
    if (!tapInNs || ipAssigned) return;
    setIpAssigned(true);
    term.addAction('assigning IP and bringing interface up');
    term.addCmd('sudo ip netns exec ns-red ip link set lo up');
    term.addCmd('sudo ip netns exec ns-red ip link set tap-red up');
    term.addCmd('sudo ip netns exec ns-red ip addr add 10.0.1.1/24 dev tap-red');
    term.addCmd('sudo ip netns exec ns-red ip addr show tap-red');
    term.addOutput('5: tap-red: <BROADCAST,MULTICAST,UP> mtu 1500 ...');
    term.addOutput('    link/ether 02:1a:4f:9c:b2:e1 brd ff:ff:ff:ff:ff:ff');
    term.addOutput('    inet 10.0.1.1/24 scope global tap-red');
    term.add('TAP device fully configured inside the namespace. Mission complete.', 'success');
    onComplete && onComplete();
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>Virtual devices</h4>
          <PalettePiece piece={{type:'tap', name:'tap-red', label:'tap-red', desc:'L2 TAP device for ns-red'}} used={tapPlaced} />
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            <strong style={{color:'var(--ink-soft)'}}>TAP</strong> = Layer-2 virtual NIC. Every KVM VM has one. <strong style={{color:'var(--ink-soft)'}}>TUN</strong> = Layer-3, used by VPNs. We use TAP here because VMs need full Ethernet frame access.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${ipAssigned ? 'win' : 'live'}`}>
              <span className="dot"/>
              {ipAssigned ? 'TAP wired up' : tapInNs ? 'TAP inside ns-red — needs an IP' : tapPlaced ? 'TAP on host — drag it into ns-red' : 'drop TAP on host first'}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" disabled={!tapInNs || ipAssigned} onClick={handleAssignIp}>assign 10.0.1.1/24 →</button>
          </div>
        </div>
        <div className="host-bezel"><span className="host-bezel-label">host — root namespace</span></div>
        
        {/* Host TAP zone — first drop spot */}
        <div
          className={`dropzone ${tapPlaced && !tapInNs ? '' : tapPlaced ? '' : 'target'}`}
          style={{ left:'6%', top:'15%', width:'40%', height:'14%' }}
          onDragOver={(e)=>e.preventDefault()}
          onDrop={handleHostDrop}
        >
          {tapPlaced && !tapInNs ? (
            <div
              className="placed tap"
              draggable
              onDragStart={(e) => {
                e.dataTransfer.setData('application/json', JSON.stringify({type:'tap',name:'tap-red'}));
                e.dataTransfer.effectAllowed = 'move';
              }}
              style={{position:'relative',cursor:'grab',marginTop:0,width:'auto'}}
            >
              <div className="placed-head">
                <span className="placed-name">tap-red</span>
                <span className="placed-type">tap · DOWN</span>
              </div>
              <div className="placed-ip" style={{color:'var(--ink-mute)'}}>no IP · host ns</div>
            </div>
          ) : tapPlaced ? (
            <div style={{color:'var(--ink-mute)',fontFamily:'Space Mono',fontSize:'.7rem'}}>↓ moved into ns-red</div>
          ) : (
            <>
              <div className="dropzone-label">step 1 · host slot</div>
              <div className="dropzone-hint">drop TAP here to create it on the host</div>
            </>
          )}
        </div>
        
        {/* ns-red box */}
        <div
          className={`dropzone ${tapInNs ? '' : tapPlaced ? 'target' : ''}`}
          style={{ left:'30%', top:'42%', width:'40%', height:'42%' }}
          onDragOver={(e)=>e.preventDefault()}
          onDrop={handleNsDrop}
        >
          <div style={{position:'absolute',top:8,left:12,fontFamily:'Space Mono',fontSize:'.7rem',color:'var(--accent-4)'}}>ns-red</div>
          {tapInNs ? (
            <div className="placed namespace" style={{position:'relative',width:'90%',marginTop:'1.4rem'}}>
              <div className="placed-head">
                <span className="placed-name">tap-red</span>
                <span className="placed-type">{ipAssigned ? 'tap · UP' : 'tap · DOWN'}</span>
              </div>
              <div className="placed-ip">{ipAssigned ? '10.0.1.1/24' : 'no IP'}</div>
              <div className="placed-children">
                <div className="placed-child"><span className="dot"/>lo {ipAssigned ? '(UP)' : '(DOWN)'}</div>
              </div>
            </div>
          ) : (
            <>
              <div className="dropzone-label" style={{marginTop:'1.4rem'}}>step 2 · ns-red</div>
              <div className="dropzone-hint">{tapPlaced ? 'drag tap-red from host into here' : 'create TAP on host first'}</div>
            </>
          )}
        </div>
      </div>
    </>
  );
}

/* ---------- Mission 3: The Cable (veth pair) ---------- */
function Mission3({ onComplete, reset, term }) {
  const [vethPlaced, setVethPlaced] = useState(false);
  const [redEnd, setRedEnd] = useState(false);
  const [blueEnd, setBlueEnd] = useState(false);
  const [ipsSet, setIpsSet] = useState(false);
  const [pinged, setPinged] = useState(false);
  
  useEffect(() => {
    setVethPlaced(false); setRedEnd(false); setBlueEnd(false); setIpsSet(false); setPinged(false);
    term.reset([{text:'mission 3: build a veth pair, drop each end in a namespace, ping across.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const handleVethDrop = (e) => {
    e.preventDefault();
    const data = e.dataTransfer.getData('application/json');
    if (!data) return;
    const piece = JSON.parse(data);
    if (piece.type !== 'veth' || vethPlaced) return;
    setVethPlaced(true);
    term.addAction('created veth pair on host');
    term.addCmd(PIECE_TYPES.veth.cmd({ a: 'veth-red', b: 'veth-blue' }));
    term.addOutput('(both ends in root namespace, both DOWN)');
  };
  
  const handleRedDrop = (e) => {
    e.preventDefault();
    if (!vethPlaced || redEnd) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.end !== 'red') return;
    setRedEnd(true);
    term.addAction('moving veth-red into ns-red');
    term.addCmd('sudo ip link set veth-red netns ns-red');
  };
  
  const handleBlueDrop = (e) => {
    e.preventDefault();
    if (!vethPlaced || blueEnd) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.end !== 'blue') return;
    setBlueEnd(true);
    term.addAction('moving veth-blue into ns-blue');
    term.addCmd('sudo ip link set veth-blue netns ns-blue');
  };
  
  const assignIps = () => {
    if (!redEnd || !blueEnd || ipsSet) return;
    setIpsSet(true);
    term.addAction('assigning IPs and bringing both ends up');
    term.addCmd('sudo ip netns exec ns-red ip addr add 10.0.0.1/24 dev veth-red');
    term.addCmd('sudo ip netns exec ns-red ip link set veth-red up');
    term.addCmd('sudo ip netns exec ns-blue ip addr add 10.0.0.2/24 dev veth-blue');
    term.addCmd('sudo ip netns exec ns-blue ip link set veth-blue up');
  };
  
  const tryPing = () => {
    if (!ipsSet || pinged) return;
    setPinged(true);
    term.addDivider('attempting ping from ns-red to 10.0.0.2 (ns-blue)');
    term.addCmd('sudo ip netns exec ns-red ping -c 2 10.0.0.2');
    term.addOutput('PING 10.0.0.2 (10.0.0.2) 56(84) bytes of data.');
    term.addOutput('64 bytes from 10.0.0.2: icmp_seq=1 ttl=64 time=0.082 ms');
    term.addOutput('64 bytes from 10.0.0.2: icmp_seq=2 ttl=64 time=0.041 ms');
    term.addOutput('');
    term.addOutput('--- 10.0.0.2 ping statistics ---');
    term.addOutput('2 packets transmitted, 2 received, 0% packet loss');
    term.add('two namespaces, one virtual cable. ARP resolved, ICMP echoed. Mission complete.', 'success');
    onComplete && onComplete();
  };
  
  // The two veth ends in the canvas centre that can be dragged once the pair is created
  const allowDrop = (e) => e.preventDefault();
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>Virtual cables</h4>
          <PalettePiece piece={{type:'veth', name:'veth-red↔veth-blue', label:'veth pair', desc:'two-ended virtual cable'}} used={vethPlaced} />
        </div>
        {vethPlaced && (
          <div className="palette-group">
            <h4>Ends (drag into namespaces)</h4>
            {!redEnd && (
              <div className="piece" draggable
                onDragStart={(e) => { e.dataTransfer.setData('application/json', JSON.stringify({type:'veth-end',end:'red'})); }}
              >
                <div className="piece-icon veth">RE</div>
                <div><div className="piece-name">veth-red</div><div className="piece-desc">→ ns-red</div></div>
              </div>
            )}
            {!blueEnd && (
              <div className="piece" draggable
                onDragStart={(e) => { e.dataTransfer.setData('application/json', JSON.stringify({type:'veth-end',end:'blue'})); }}
              >
                <div className="piece-icon veth">BE</div>
                <div><div className="piece-name">veth-blue</div><div className="piece-desc">→ ns-blue</div></div>
              </div>
            )}
          </div>
        )}
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            A veth pair is two ends of one virtual cable. Anything written to one end appears immediately on the other. Delete one end — the peer dies too. Always created together.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${pinged ? 'win' : 'live'}`}>
              <span className="dot"/>
              {pinged ? 'cross-namespace ping works' : ipsSet ? 'ready to ping' : (redEnd && blueEnd) ? 'set IPs next' : vethPlaced ? 'drop each end in a namespace' : 'create the veth pair'}
            </div>
          </div>
          <div className="right">
            {redEnd && blueEnd && !ipsSet && <button className="btn btn-ghost" onClick={assignIps}>assign IPs →</button>}
            {ipsSet && !pinged && <button className="btn btn-primary" onClick={tryPing}>ping across →</button>}
          </div>
        </div>
        <div className="host-bezel"><span className="host-bezel-label">host</span></div>
        
        {/* Workbench area — where the freshly created veth pair appears */}
        {!vethPlaced && (
          <div
            className="dropzone target"
            style={{ left:'30%', top:'12%', width:'40%', height:'14%' }}
            onDragOver={allowDrop} onDrop={handleVethDrop}
          >
            <div className="dropzone-label">step 1 · workbench</div>
            <div className="dropzone-hint">drop the veth pair here to create both ends</div>
          </div>
        )}
        {vethPlaced && (
          <div style={{position:'absolute',top:'14%',left:'30%',width:'40%',textAlign:'center',fontFamily:'Space Mono',fontSize:'.7rem',color:'var(--ink-mute)'}}>
            veth pair created on host — both ends DOWN
          </div>
        )}
        
        {/* ns-red */}
        <div
          className={`dropzone ${redEnd ? '' : vethPlaced ? 'target' : ''}`}
          style={{ left:'6%', top:'34%', width:'36%', height:'52%' }}
          onDragOver={allowDrop} onDrop={handleRedDrop}
        >
          <div style={{position:'absolute',top:8,left:12,fontFamily:'Space Mono',fontSize:'.72rem',color:'var(--accent-4)'}}>ns-red</div>
          {redEnd ? (
            <div className="placed veth-end" style={{position:'relative',width:'85%',marginTop:'1.4rem'}}>
              <div className="placed-head">
                <span className="placed-name">veth-red</span>
                <span className="placed-type">{ipsSet ? 'veth · UP' : 'veth · DOWN'}</span>
              </div>
              <div className="placed-ip">{ipsSet ? '10.0.0.1/24' : 'no IP'}</div>
              <div className="placed-ip" style={{color:'var(--ink-mute)',fontSize:'.62rem'}}>peer: veth-blue</div>
            </div>
          ) : (
            <div style={{position:'absolute',top:'45%',left:0,right:0,textAlign:'center'}}>
              <div className="dropzone-label">drag veth-red here</div>
            </div>
          )}
        </div>
        
        {/* ns-blue */}
        <div
          className={`dropzone ${blueEnd ? '' : vethPlaced ? 'target' : ''}`}
          style={{ left:'58%', top:'34%', width:'36%', height:'52%' }}
          onDragOver={allowDrop} onDrop={handleBlueDrop}
        >
          <div style={{position:'absolute',top:8,left:12,fontFamily:'Space Mono',fontSize:'.72rem',color:'var(--accent-3)'}}>ns-blue</div>
          {blueEnd ? (
            <div className="placed veth-end" style={{position:'relative',width:'85%',marginTop:'1.4rem'}}>
              <div className="placed-head">
                <span className="placed-name">veth-blue</span>
                <span className="placed-type">{ipsSet ? 'veth · UP' : 'veth · DOWN'}</span>
              </div>
              <div className="placed-ip">{ipsSet ? '10.0.0.2/24' : 'no IP'}</div>
              <div className="placed-ip" style={{color:'var(--ink-mute)',fontSize:'.62rem'}}>peer: veth-red</div>
            </div>
          ) : (
            <div style={{position:'absolute',top:'45%',left:0,right:0,textAlign:'center'}}>
              <div className="dropzone-label">drag veth-blue here</div>
            </div>
          )}
        </div>
        
        {/* the cable */}
        {redEnd && blueEnd && (
          <svg className="wires-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <path d={`M 240 480 C 400 ${pinged ? '430' : '480'}, 600 ${pinged ? '430' : '480'}, 760 480`}
              className={`wire ${pinged ? 'active' : ''}`} strokeWidth="3" fill="none"/>
          </svg>
        )}
      </div>
    </>
  );
}

/* ---------- Mission 4: Build a Hub (3 ns on OVS bridge) ---------- */
function Mission4({ onComplete, reset, term }) {
  const [bridge, setBridge] = useState(false);
  const [ports, setPorts] = useState({ a: false, b: false, c: false });
  const [verified, setVerified] = useState(false);
  
  useEffect(() => {
    setBridge(false); setPorts({a:false,b:false,c:false}); setVerified(false);
    term.reset([{text:'mission 4: drop an OVS bridge, then plug three ns-veth pairs into it.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const handleBridgeDrop = (e) => {
    e.preventDefault();
    if (bridge) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.type !== 'bridge') return;
    setBridge(true);
    term.addAction('installed Open vSwitch');
    term.addCmd('sudo apt install -y openvswitch-switch');
    term.addAction('creating OVS bridge br-int');
    term.addCmd(PIECE_TYPES.bridge.cmd({ name: 'br-int' }));
    term.addCmd('sudo ovs-ofctl dump-flows br-int');
    term.addOutput(' cookie=0x0, duration=1.234s, table=0, n_packets=0, n_bytes=0, priority=0 actions=NORMAL');
    term.addOutput('(default learning-switch flow installed automatically)');
  };
  
  const handlePortDrop = (key, e) => {
    e.preventDefault();
    if (!bridge || ports[key]) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.type !== 'veth' || piece.key !== key) return;
    const ip = { a:'192.168.100.10', b:'192.168.100.20', c:'192.168.100.30' }[key];
    setPorts(p => ({ ...p, [key]: true }));
    term.addAction(`wiring ns-${key} to br-int via veth-${key}/veth-${key}-ovs`);
    term.addCmd(`sudo ip netns add ns-${key}`);
    term.addCmd(`sudo ip link add veth-${key} type veth peer name veth-${key}-ovs`);
    term.addCmd(`sudo ip link set veth-${key} netns ns-${key}`);
    term.addCmd(`sudo ovs-vsctl add-port br-int veth-${key}-ovs`);
    term.addCmd(`sudo ip link set veth-${key}-ovs up`);
    term.addCmd(`sudo ip netns exec ns-${key} ip link set veth-${key} up`);
    term.addCmd(`sudo ip netns exec ns-${key} ip addr add ${ip}/24 dev veth-${key}`);
  };
  
  const verify = () => {
    if (!ports.a || !ports.b || !ports.c || verified) return;
    setVerified(true);
    term.addDivider('full-mesh ping check');
    ['a→b','a→c','b→c'].forEach(pair => {
      const [src, dst] = pair.split('→');
      const dstIp = { a:'.10', b:'.20', c:'.30' }[dst];
      term.addCmd(`sudo ip netns exec ns-${src} ping -c 1 192.168.100${dstIp}`);
      term.addOutput(`64 bytes from 192.168.100${dstIp}: icmp_seq=1 ttl=64 time=0.${Math.floor(Math.random()*9)}${Math.floor(Math.random()*9)} ms`);
    });
    term.addAction('inspecting MAC learning');
    term.addCmd('sudo ovs-appctl fdb/show br-int');
    term.addOutput(' port  VLAN  MAC                Age');
    term.addOutput('    1     0  02:8a:1b:3c:9f:01    2');
    term.addOutput('    2     0  02:8a:1b:3c:9f:02    1');
    term.addOutput('    3     0  02:8a:1b:3c:9f:03    1');
    term.add('three namespaces, one OVS bridge, full L2 connectivity. NORMAL flow handled the learning. Mission complete.', 'success');
    onComplete && onComplete();
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>L2 switch</h4>
          <PalettePiece piece={{type:'bridge', name:'br-int', label:'OVS bridge', desc:'br-int — software switch'}} used={bridge} />
        </div>
        {bridge && (
          <div className="palette-group">
            <h4>Veth-port pairs</h4>
            {['a','b','c'].map(k => !ports[k] && (
              <div key={k} className="piece" draggable
                onDragStart={(e) => { e.dataTransfer.setData('application/json', JSON.stringify({type:'veth',key:k})); }}
              >
                <div className="piece-icon veth">{`V${k.toUpperCase()}`}</div>
                <div>
                  <div className="piece-name">ns-{k} · veth pair</div>
                  <div className="piece-desc">veth-{k} ↔ veth-{k}-ovs · {`192.168.100.${k==='a'?10:k==='b'?20:30}`}</div>
                </div>
              </div>
            ))}
          </div>
        )}
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            For N namespaces, full-mesh veth pairs scale as N². A switch scales as N. The new <code style={{fontSize:'.85em'}}>NORMAL</code> flow on br-int makes it act like a learning bridge.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${verified ? 'win' : 'live'}`}>
              <span className="dot"/>
              {verified ? 'full mesh up' : `${Object.values(ports).filter(Boolean).length}/3 namespaces plugged`}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" disabled={!ports.a||!ports.b||!ports.c||verified} onClick={verify}>verify mesh →</button>
          </div>
        </div>
        <div className="host-bezel"><span className="host-bezel-label">host</span></div>
        
        {/* three namespace zones */}
        {[
          {k:'a',x:'5%'},
          {k:'b',x:'37%'},
          {k:'c',x:'69%'}
        ].map(({k,x}) => (
          <div key={k}
            className={`dropzone ${ports[k] ? '' : bridge ? 'target' : ''}`}
            style={{ left:x, top:'12%', width:'26%', height:'30%' }}
            onDragOver={(e)=>e.preventDefault()}
            onDrop={(e)=>handlePortDrop(k,e)}
          >
            <div style={{position:'absolute',top:8,left:12,fontFamily:'Space Mono',fontSize:'.72rem',color:'var(--accent-4)'}}>ns-{k}</div>
            {ports[k] ? (
              <div className="placed veth-end" style={{position:'relative',width:'92%',marginTop:'1.2rem'}}>
                <div className="placed-head">
                  <span className="placed-name">veth-{k}</span>
                  <span className="placed-type">veth · UP</span>
                </div>
                <div className="placed-ip">192.168.100.{k==='a'?10:k==='b'?20:30}/24</div>
              </div>
            ) : (
              <div style={{position:'absolute',top:'55%',left:0,right:0,textAlign:'center'}}>
                <div className="dropzone-label">{bridge ? `drop ns-${k} pair` : 'create bridge first'}</div>
              </div>
            )}
          </div>
        ))}
        
        {/* OVS bridge */}
        <div
          className={`dropzone ${bridge ? '' : 'target'}`}
          style={{ left:'5%', top:'62%', width:'90%', height:'22%' }}
          onDragOver={(e)=>e.preventDefault()}
          onDrop={handleBridgeDrop}
        >
          {bridge ? (
            <div className="placed bridge" style={{position:'relative',width:'94%',marginTop:'0'}}>
              <div className="placed-head">
                <span className="placed-name">br-int</span>
                <span className="placed-type">OVS bridge</span>
              </div>
              <div className="placed-ip" style={{color:'var(--ink-mute)'}}>default flow · table=0 priority=0 actions=NORMAL</div>
              {(ports.a||ports.b||ports.c) && (
                <div className="placed-children" style={{flexDirection:'row',flexWrap:'wrap'}}>
                  {ports.a && <div className="placed-port">veth-a-ovs · port 1</div>}
                  {ports.b && <div className="placed-port">veth-b-ovs · port 2</div>}
                  {ports.c && <div className="placed-port">veth-c-ovs · port 3</div>}
                </div>
              )}
            </div>
          ) : (
            <>
              <div className="dropzone-label">step 1 · OVS bridge slot</div>
              <div className="dropzone-hint">drop the OVS bridge piece here</div>
            </>
          )}
        </div>
        
        {/* Wires from each ns to the bridge */}
        {bridge && (
          <svg className="wires-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            {ports.a && <path d="M 180 380 L 180 620" className={`wire ${verified ? 'active' : ''}`} strokeWidth="2"/>}
            {ports.b && <path d="M 500 380 L 500 620" className={`wire ${verified ? 'active' : ''}`} strokeWidth="2"/>}
            {ports.c && <path d="M 820 380 L 820 620" className={`wire ${verified ? 'active' : ''}`} strokeWidth="2"/>}
          </svg>
        )}
      </div>
    </>
  );
}

/* ---------- Mission 5: Watch the FDB ---------- */
function Mission5({ onComplete, reset, term }) {
  const [step, setStep] = useState(0); // 0:initial, 1:first ping, 2:fdb shown
  const [revealed, setRevealed] = useState([]);
  
  useEffect(() => {
    setStep(0); setRevealed([]);
    term.reset([
      {text:'mission 5: send pings, watch br-int learn MACs into its forwarding DB.', type:'action', id:Math.random()},
      {text:'topology preloaded: br-int with ns-a, ns-b, ns-c (192.168.100.10/20/30)', type:'action', id:Math.random()},
    ]);
  }, [reset]);
  
  const sendPing = (src, dst) => {
    const srcIp = { a:'10', b:'20', c:'30' }[src];
    const dstIp = { a:'10', b:'20', c:'30' }[dst];
    term.addAction(`ping from ns-${src} to ns-${dst}`);
    term.addCmd(`sudo ip netns exec ns-${src} ping -c 1 192.168.100.${dstIp}`);
    term.addOutput(`64 bytes from 192.168.100.${dstIp}: icmp_seq=1 ttl=64 time=0.${Math.floor(Math.random()*99)} ms`);
    // FDB now learns both MACs
    setRevealed(r => Array.from(new Set([...r, src, dst])));
    setStep(s => Math.max(s, 1));
  };
  
  const showFdb = () => {
    setStep(2);
    term.addAction('inspecting forwarding database');
    term.addCmd('sudo ovs-appctl fdb/show br-int');
    term.addOutput(' port  VLAN  MAC                Age');
    if (revealed.includes('a')) term.addOutput('    1     0  02:8a:1b:3c:9f:01    2');
    if (revealed.includes('b')) term.addOutput('    2     0  02:8a:1b:3c:9f:02    1');
    if (revealed.includes('c')) term.addOutput('    3     0  02:8a:1b:3c:9f:03    1');
    term.addOutput('(each MAC was learned from a packet that arrived on that port)');
    if (revealed.length >= 3) {
      term.add('br-int has learned all three MACs through standard L2 learning. Mission complete.', 'success');
      onComplete && onComplete();
    } else {
      term.add(`only ${revealed.length}/3 MACs learned — send pings to/from each namespace`, 'error');
    }
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">actions</div>
        <div className="palette-group">
          <h4>Send pings</h4>
          {[['a','b'],['a','c'],['b','c']].map(([s,d]) => (
            <div key={s+d} className="piece" onClick={()=>sendPing(s,d)} style={{cursor:'pointer'}}>
              <div className="piece-icon ns">→</div>
              <div>
                <div className="piece-name">ns-{s} → ns-{d}</div>
                <div className="piece-desc">click to send 1 ICMP echo</div>
              </div>
            </div>
          ))}
        </div>
        <div className="palette-group">
          <h4>Inspect</h4>
          <div className="piece" onClick={showFdb} style={{cursor:'pointer',borderColor:revealed.length>=3?'var(--accent)':undefined}}>
            <div className="piece-icon ovs">FDB</div>
            <div>
              <div className="piece-name">fdb/show br-int</div>
              <div className="piece-desc">read the forwarding database</div>
            </div>
          </div>
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            Every frame OVS sees, it learns: source MAC → ingress port. When you ping ns-b from ns-a, the bridge learns both MACs from the two-way traffic. Without traffic, no learning.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${step===2 && revealed.length>=3 ? 'win' : 'live'}`}>
              <span className="dot"/>
              {step===2 && revealed.length>=3 ? 'FDB fully populated' : `${revealed.length}/3 MACs learned`}
            </div>
          </div>
        </div>
        <div className="host-bezel"><span className="host-bezel-label">host</span></div>
        
        {/* Three namespaces at top */}
        {['a','b','c'].map((k,i) => (
          <div key={k} className="placed namespace" style={{
            left: `${8 + i*30}%`, top:'12%', width:'24%', position:'absolute',
