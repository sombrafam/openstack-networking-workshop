/* ---------- Mission 6: The Drop Rule ---------- */
function Mission6({ onComplete, reset, term }) {
  const [flowInstalled, setFlowInstalled] = useState(false);
  const [tests, setTests] = useState({ ca:false, cb:false, ac:false });
  
  useEffect(() => {
    setFlowInstalled(false); setTests({ca:false,cb:false,ac:false});
    term.reset([
      {text:'mission 6: install a flow rule that drops ns-c → ns-a. Then verify the asymmetry.', type:'action', id:Math.random()},
      {text:'topology preloaded: br-int with ns-a (.10), ns-b (.20), ns-c (.30)', type:'action', id:Math.random()},
    ]);
  }, [reset]);
  
  const handleFlowDrop = (e) => {
    e.preventDefault();
    if (flowInstalled) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.type !== 'flow') return;
    setFlowInstalled(true);
    term.addAction('installing drop flow on br-int');
    term.addCmd(`sudo ovs-ofctl add-flow br-int "priority=100,ip,nw_src=192.168.100.30,nw_dst=192.168.100.10,actions=drop"`);
    term.addCmd('sudo ovs-ofctl dump-flows br-int');
    term.addOutput(' cookie=0x0, duration=0.5s, table=0, priority=100,ip,nw_src=192.168.100.30,nw_dst=192.168.100.10 actions=drop');
    term.addOutput(' cookie=0x0, duration=120s, table=0, priority=0 actions=NORMAL');
  };
  
  const test = (key) => {
    const fail = key === 'ca'; // ns-c → ns-a is the only one that should fail
    const t = { ca:'ns-c → ns-a', cb:'ns-c → ns-b', ac:'ns-a → ns-c' };
    const src = {ca:'c',cb:'c',ac:'a'}[key];
    const dst = {ca:'.10',cb:'.20',ac:'.30'}[key];
    term.addAction(`testing ${t[key]}`);
    term.addCmd(`sudo ip netns exec ns-${src} ping -c 2 192.168.100${dst}`);
    if (fail && flowInstalled) {
      term.addOutput(`PING 192.168.100${dst} ...`);
      term.addOutput('--- 192.168.100.10 ping statistics ---');
      term.addOutput('2 packets transmitted, 0 received, 100% packet loss');
      term.add('blocked by flow rule', 'error');
    } else {
      term.addOutput(`64 bytes from 192.168.100${dst}: time=0.${Math.floor(Math.random()*99)} ms`);
      term.addOutput('--- ping statistics --- 100% received');
      term.add('reachable', 'success');
    }
    setTests(t => ({ ...t, [key]: true }));
  };
  
  useEffect(() => {
    if (flowInstalled && tests.ca && tests.cb && tests.ac) {
      term.add('asymmetric blocking proven: rule is directional. ns-a → ns-c still works because the rule matches src=30 only. Mission complete.', 'success');
      onComplete && onComplete();
    }
  }, [tests, flowInstalled]);
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>Flow rule</h4>
          <div className="piece" draggable={!flowInstalled}
            onDragStart={(e)=>{ if(!flowInstalled) e.dataTransfer.setData('application/json',JSON.stringify({type:'flow'})); }}
            style={{opacity:flowInstalled?.3:1, cursor:flowInstalled?'not-allowed':'grab'}}
          >
            <div className="piece-icon acl">DR</div>
            <div>
              <div className="piece-name">drop ns-c → ns-a</div>
              <div className="piece-desc">priority=100,ip,nw_src=.30,nw_dst=.10</div>
            </div>
          </div>
        </div>
        <div className="palette-group">
          <h4>Connectivity tests</h4>
          {[['ca','ns-c → ns-a','should fail'],['cb','ns-c → ns-b','should work'],['ac','ns-a → ns-c','should work']].map(([k,n,h]) => (
            <div key={k} className="piece" onClick={()=>test(k)} style={{cursor:'pointer',borderColor:tests[k]?'var(--accent)':undefined}}>
              <div className="piece-icon ns">→</div>
              <div>
                <div className="piece-name">{n}</div>
                <div className="piece-desc">{h}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            Match fields are directional. <code style={{fontSize:'.85em'}}>nw_src=X,nw_dst=Y</code> blocks X→Y but says nothing about Y→X. To block both directions you need two rules — or a stateful one.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${tests.ca && tests.cb && tests.ac && flowInstalled ? 'win' : 'live'}`}>
              <span className="dot"/>
              {flowInstalled ? `flow installed · ${Object.values(tests).filter(Boolean).length}/3 tests run` : 'install the drop rule on br-int'}
            </div>
          </div>
        </div>
        <div className="host-bezel"><span className="host-bezel-label">host</span></div>
        
        {/* Three namespaces */}
        {[
          {k:'a',ip:'10',x:'5%',color:'var(--accent-4)'},
          {k:'b',ip:'20',x:'37%',color:'var(--accent)'},
          {k:'c',ip:'30',x:'69%',color:'var(--danger)'},
        ].map(({k,ip,x,color}) => (
          <div key={k} className="placed namespace" style={{left:x,top:'12%',width:'26%',position:'absolute',borderColor:color}}>
            <div className="placed-head">
              <span className="placed-name" style={{color}}>ns-{k}</span>
              <span className="placed-type">netns</span>
            </div>
            <div className="placed-ip">192.168.100.{ip}/24</div>
          </div>
        ))}
        
        {/* Flow rule drop slot */}
        <div
          className={`dropzone ${flowInstalled ? '' : 'target'}`}
          style={{ left:'5%', top:'40%', width:'90%', height:'22%' }}
          onDragOver={(e)=>e.preventDefault()}
          onDrop={handleFlowDrop}
        >
          {flowInstalled ? (
            <div style={{width:'92%'}}>
              <div className="placed flow" style={{position:'relative',marginBottom:'.4rem',width:'100%'}}>
                <div className="placed-head"><span className="placed-name" style={{color:'var(--danger)'}}>priority=100</span><span className="placed-type">drop rule</span></div>
                <div className="placed-ip mono">ip,nw_src=192.168.100.30,nw_dst=192.168.100.10 → drop</div>
              </div>
              <div className="placed flow" style={{position:'relative',width:'100%',opacity:.7}}>
                <div className="placed-head"><span className="placed-name">priority=0</span><span className="placed-type">default</span></div>
                <div className="placed-ip mono">(any) → NORMAL</div>
              </div>
            </div>
          ) : (
            <>
              <div className="dropzone-label">br-int · flow table</div>
              <div className="dropzone-hint">drag the drop rule here</div>
            </>
          )}
        </div>
        
        {/* br-int label */}
        <div style={{position:'absolute',left:'5%',top:'65%',width:'90%',padding:'.6rem 1rem',
          background:'var(--bg-elev)',border:'1px solid var(--line)',borderRadius:8,
          fontFamily:'Space Mono',fontSize:'.74rem',color:'var(--ink-mute)'}}>
          <strong style={{color:'var(--ink-soft)'}}>br-int</strong> · OVS bridge · 3 ports
        </div>
        
        {/* connection lines showing the blocked traffic */}
        {flowInstalled && (
          <svg className="wires-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            {/* c -> a blocked */}
            {tests.ca && <path d="M 820 200 C 600 250, 300 250, 180 200" className="wire danger" strokeWidth="2.5" strokeDasharray="4 4"/>}
          </svg>
        )}
      </div>
    </>
  );
}

/* ---------- Mission 7: Priority Trap ---------- */
function Mission7({ onComplete, reset, term }) {
  const flows = [
    { id:'a', priority:200, match:'in_port=1', action:'output:2', label:'specific port forward' },
    { id:'b', priority:100, match:'dl_type=0x0806', action:'flood', label:'ARP flood' },
    { id:'c', priority:0, match:'(any)', action:'NORMAL', label:'catch-all' },
  ];
  const [order, setOrder] = useState(['c','b','a']); // start unsorted (lowest first)
  const [verified, setVerified] = useState(false);
  const [draggedIdx, setDraggedIdx] = useState(null);
  
  useEffect(() => {
    setOrder(['c','b','a']); setVerified(false);
    term.reset([{text:'mission 7: OpenFlow evaluates flows by descending priority. Reorder them correctly.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const move = (from, to) => {
    if (from === to || to < 0 || to >= order.length) return;
    const next = [...order];
    const [item] = next.splice(from, 1);
    next.splice(to, 0, item);
    setOrder(next);
    term.addAction(`reordered: ${next.map(id=>{const f=flows.find(x=>x.id===id);return `pri=${f.priority}`}).join(' → ')}`);
  };
  
  const verify = () => {
    const correct = order[0]==='a' && order[1]==='b' && order[2]==='c';
    if (correct) {
      setVerified(true);
      term.addDivider('packet arrives on port 1 with dl_type=0x0806 (ARP)');
      term.addCmd('ovs-appctl ofproto/trace br-int "in_port=1,dl_type=0x0806"');
      term.addOutput('bridge("br-int")');
      term.addOutput('-----');
      term.addOutput(' 0. priority 200, in_port=1, output:2');
      term.addOutput('Final: out port 2 only — rule (a) matched first; (b) and (c) never evaluated.');
      term.add('priority is absolute. First match wins, regardless of specificity. Mission complete.', 'success');
      onComplete && onComplete();
    } else {
      term.add(`wrong order. Should be priority=200 → 100 → 0. Got ${order.map(id=>flows.find(x=>x.id===id).priority).join('→')}`, 'error');
    }
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">your task</div>
        <div className="palette-group">
          <h4>How OpenFlow evaluates</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            When a packet enters table 0, OVS checks rules in <strong style={{color:'var(--ink-soft)'}}>descending priority order</strong>. The first rule whose match fields apply, wins. The remaining rules are not evaluated.
          </p>
        </div>
        <div className="palette-group">
          <h4>Common confusion</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            People assume more-specific matches override less-specific ones. <strong style={{color:'var(--danger)'}}>They don't.</strong> Only the priority number matters.
          </p>
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Test scenario</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            A packet enters br-int on port 1 with dl_type=0x0806 (ARP). Two rules match it: the port-1 rule and the ARP rule. Which wins?
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${verified ? 'win' : 'live'}`}>
              <span className="dot"/>
              {verified ? 'ordered correctly' : 'drag flow rules into descending priority order'}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" onClick={verify} disabled={verified}>trace the packet →</button>
          </div>
        </div>
        <div style={{position:'absolute',inset:'80px 40px 40px',display:'flex',flexDirection:'column',gap:'.6rem'}}>
          <div style={{fontFamily:'Space Mono',fontSize:'.7rem',color:'var(--ink-mute)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.3rem'}}>
            br-int — flow table (drag to reorder)
          </div>
          {order.map((id, idx) => {
            const f = flows.find(x => x.id === id);
            const ok = order.indexOf(id) === [...order].sort((a,b)=>flows.find(x=>x.id===b).priority-flows.find(x=>x.id===a).priority).indexOf(id);
            return (
              <div
                key={id}
                draggable
                onDragStart={(e) => { setDraggedIdx(idx); e.dataTransfer.effectAllowed='move'; }}
                onDragOver={(e) => { e.preventDefault(); }}
                onDrop={(e) => { e.preventDefault(); if (draggedIdx !== null) move(draggedIdx, idx); setDraggedIdx(null); }}
                onDragEnd={() => setDraggedIdx(null)}
                style={{
                  padding:'.85rem 1.1rem',
                  background:'var(--bg-elev)',
                  border:`1.5px solid ${ok && !verified ? 'var(--line-strong)' : verified ? 'var(--accent)' : 'var(--line-strong)'}`,
                  borderRadius:8, cursor:'grab', userSelect:'none',
                  display:'flex', alignItems:'center', gap:'1rem',
                  fontFamily:'Space Mono',fontSize:'.85rem',
                  transition:'all .15s',
                  opacity: draggedIdx === idx ? 0.4 : 1,
                  boxShadow:verified&&idx===0?'0 0 24px rgba(125,249,184,.2)':undefined
                }}
              >
                <div style={{
                  fontFamily:'Major Mono Display',monospace,fontSize:'1.4rem',color:'var(--ink-mute)',width:32,textAlign:'center'
                }}>≡</div>
                <div style={{
                  background:'rgba(125,249,184,.12)',color:'var(--accent)',
                  padding:'.3rem .6rem',borderRadius:5,minWidth:90,textAlign:'center',
                  fontWeight:700,fontSize:'.85rem'
                }}>pri={f.priority}</div>
                <div style={{flex:1}}>
                  <div style={{color:'var(--ink)'}}>{f.match}</div>
                  <div style={{fontSize:'.7rem',color:'var(--ink-mute)',marginTop:'.15rem'}}>{f.label}</div>
                </div>
                <div style={{color:f.action==='drop'?'var(--danger)':'var(--accent-2)',fontFamily:'Space Mono',fontWeight:700}}>→ {f.action}</div>
                {idx===0 && verified && <div style={{fontFamily:'Space Mono',fontSize:'.7rem',color:'var(--accent)'}}>⚡ wins</div>}
              </div>
            );
          })}
          <div style={{marginTop:'1.2rem',padding:'.85rem 1.1rem',background:'rgba(255,184,73,.04)',
            border:'1px solid rgba(255,184,73,.2)',borderRadius:8,fontSize:'.82rem',color:'var(--accent-2)'}}>
            <strong style={{fontWeight:600}}>Incoming packet:</strong> in_port=1, dl_type=0x0806 (ARP) — both rules (a) and (b) would match. Which wins is purely a function of priority.
          </div>
        </div>
      </div>
    </>
  );
}

/* ---------- Mission 8: Cross the Wire (VXLAN) ---------- */
function Mission8({ onComplete, reset, term }) {
  const [tunnels, setTunnels] = useState({ A:false, B:false });
  const [verified, setVerified] = useState(false);
  
  useEffect(() => {
    setTunnels({A:false,B:false}); setVerified(false);
    term.reset([{text:'mission 8: connect two br-int bridges (one per host) with a VXLAN tunnel. VNI=100.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const drop = (host, e) => {
    e.preventDefault();
    if (tunnels[host]) return;
    const data = e.dataTransfer.getData('application/json');
    const piece = JSON.parse(data);
    if (piece.type !== 'tunnel' || piece.host !== host) return;
    const remote = host === 'A' ? '10.0.0.6' : '10.0.0.5';
    setTunnels(t => ({ ...t, [host]: true }));
    term.addAction(`adding VXLAN port on host ${host}'s br-int`);
    term.addCmd(`sudo ovs-vsctl add-port br-int vxlan0 \\\n  -- set interface vxlan0 type=vxlan \\\n     options:remote_ip=${remote} \\\n     options:key=100`);
  };
  
  const verify = () => {
    if (!tunnels.A || !tunnels.B || verified) return;
    setVerified(true);
    term.addDivider('attempting cross-host ping from host A\'s ns-a to host B\'s ns-c');
    term.addCmd('sudo ip netns exec ns-a ping -c 2 192.168.100.30');
    term.addOutput('64 bytes from 192.168.100.30: icmp_seq=1 ttl=64 time=2.4 ms');
    term.addOutput('64 bytes from 192.168.100.30: icmp_seq=2 ttl=64 time=1.8 ms');
    term.addAction('inspecting tunnel traffic on host A');
    term.addCmd('sudo tcpdump -i eth0 -nn udp port 4789');
    term.addOutput('10.0.0.5.45123 > 10.0.0.6.4789: VXLAN, flags [I] (0x08), vni 100');
    term.addOutput('  IP 192.168.100.10 > 192.168.100.30: ICMP echo request');
    term.add('Layer-2 over Layer-3 — two bridges in different /24s now share a broadcast domain. Mission complete.', 'success');
    onComplete && onComplete();
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>VXLAN tunnel endpoints</h4>
          {!tunnels.A && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'tunnel',host:'A'}))}>
              <div className="piece-icon tunnel">VX</div>
              <div><div className="piece-name">host A · vxlan0</div><div className="piece-desc">remote=10.0.0.6 · vni=100</div></div>
            </div>
          )}
          {!tunnels.B && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'tunnel',host:'B'}))}>

            </div>
          )}
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            VXLAN wraps Ethernet frames inside UDP/4789 packets. The VNI is a 24-bit network ID (16M tenants). Two bridges with matching VNIs share an L2 broadcast domain — even across L3 hops.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${verified ? 'win' : 'live'}`}>
              <span className="dot"/>
              {verified ? 'overlay established' : `${Object.values(tunnels).filter(Boolean).length}/2 endpoints configured`}
            </div>

          border:'1.5px solid var(--line-strong)',borderRadius:10,

            <div className="placed namespace" style={{position:'relative',flex:1,width:'auto'}}>
              <div className="placed-head"><span className="placed-name">ns-a</span><span className="placed-type">netns</span></div>

/* ---------- Mission 9: Logical Switch (OVN) ---------- */
function Mission9({ onComplete, reset, term }) {
  const [ls, setLs] = useState(false);
  const [ports, setPorts] = useState({ p1:false, p2:false });
  const [bound, setBound] = useState({ p1:false, p2:false });
  const [pinged, setPinged] = useState(false);
  
  useEffect(() => {
    setLs(false); setPorts({p1:false,p2:false}); setBound({p1:false,p2:false}); setPinged(false);
    term.reset([{text:'mission 9: declare a logical switch in OVN, add two ports, bind to namespaces.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const dropLs = (e) => {
    e.preventDefault();
    if (ls) return;
    const piece = JSON.parse(e.dataTransfer.getData('application/json'));
    if (piece.type !== 'lswitch') return;
    setLs(true);
    term.addAction('declaring logical switch ls1 in OVN northbound');
    term.addCmd('ovn-nbctl ls-add ls1');
  };
  
  const dropPort = (which, e) => {
    e.preventDefault();
    if (!ls || ports[which]) return;
    const piece = JSON.parse(e.dataTransfer.getData('application/json'));
    if (piece.type !== 'lsp' || piece.which !== which) return;
    const num = which === 'p1' ? 1 : 2;
    const ip = which === 'p1' ? '10.0.1.10' : '10.0.1.20';
    const mac = which === 'p1' ? 'aa:bb:cc:00:00:01' : 'aa:bb:cc:00:00:02';
    setPorts(p => ({ ...p, [which]: true }));
    term.addAction(`adding logical port ls1-port${num}`);
    term.addCmd(`ovn-nbctl lsp-add ls1 ls1-port${num}`);
    term.addCmd(`ovn-nbctl lsp-set-addresses ls1-port${num} "${mac} ${ip}"`);
  };
  
  const bindPort = (which) => {
    if (!ports[which] || bound[which]) return;
    const num = which === 'p1' ? 1 : 2;
    const k = which === 'p1' ? 'a' : 'b';
    const ip = which === 'p1' ? '10.0.1.10' : '10.0.1.20';
    setBound(b => ({ ...b, [which]: true }));
    term.addAction(`binding ns-${k} to ls1-port${num} via iface-id`);
    term.addCmd(`sudo ovs-vsctl set interface veth-${k}-ovs external-ids:iface-id=ls1-port${num}`);
    term.addCmd('ovn-sbctl show');
    term.addOutput('Chassis chassis-local');
    term.addOutput(`    Port_Binding ls1-port${num}`);
  };
  
  const ping = () => {
    if (!bound.p1 || !bound.p2 || pinged) return;
    setPinged(true);
    term.addDivider('intra-switch ping through OVN');
    term.addCmd('sudo ip netns exec ns-a ping -c 2 10.0.1.20');
    term.addOutput('64 bytes from 10.0.1.20: icmp_seq=1 ttl=64 time=0.42 ms');
    term.addOutput('64 bytes from 10.0.1.20: icmp_seq=2 ttl=64 time=0.38 ms');
    term.addAction('peek at compiled logical flows');
    term.addCmd('ovn-sbctl lflow-list ls1');
    term.addOutput('Datapath: "ls1"');
    term.addOutput('  table=0 (ls_in_port_sec_l2), priority=100, match=(inport=="ls1-port1"), action=(next;)');
    term.addOutput('  table=13(ls_in_l2_lkup    ), priority=50,  match=(eth.dst==aa:bb:cc:00:00:02), action=(outport="ls1-port2"; output;)');
    term.add('intent → logical flows → OpenFlow → packets. The OVN compiler chain at work. Mission complete.', 'success');
    onComplete && onComplete();
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>OVN northbound</h4>
          {!ls && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'lswitch'}))}>
              <div className="piece-icon ovn">LS</div>
              <div><div className="piece-name">ls1</div><div className="piece-desc">logical switch (10.0.1.0/24)</div></div>
            </div>
          )}
          {ls && !ports.p1 && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'lsp',which:'p1'}))}>
              <div className="piece-icon ovn">P1</div>
              <div><div className="piece-name">ls1-port1</div><div className="piece-desc">aa:bb:cc:00:00:01 · 10.0.1.10</div></div>
            </div>
          )}
          {ls && !ports.p2 && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'lsp',which:'p2'}))}>
              <div className="piece-icon ovn">P2</div>
              <div><div className="piece-name">ls1-port2</div><div className="piece-desc">aa:bb:cc:00:00:02 · 10.0.1.20</div></div>
            </div>
          )}
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            A logical port doesn't exist physically until bound. <code style={{fontSize:'.85em'}}>external-ids:iface-id=&lt;lsp&gt;</code> on an OVS interface tells ovn-controller: "this OVS port realises that OVN port". Then traffic flows.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${pinged?'win':'live'}`}>
              <span className="dot"/>
              {pinged ? 'OVN compiled, packets flowing' : !ls ? 'declare logical switch' : !ports.p1||!ports.p2 ? 'add logical ports' : !bound.p1||!bound.p2 ? 'bind to namespaces' : 'ready to ping'}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" onClick={ping} disabled={!bound.p1||!bound.p2||pinged}>ping via ovn →</button>
          </div>
        </div>
        
        {/* OVN central — top */}
        <div style={{position:'absolute',left:'12%',top:'8%',width:'76%',
          border:'1px solid var(--accent-3)',borderRadius:8,padding:'.7rem 1rem',
          background:'rgba(167,139,250,.04)'}}>
          <div style={{fontFamily:'Space Mono',fontSize:'.66rem',color:'var(--accent-3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.4rem'}}>OVN — northbound DB (intent)</div>
          <div
            className={`dropzone ${ls?'':'target'}`}
            style={{position:'relative',minHeight:60,width:'100%',padding:'.4rem'}}
            onDragOver={(e)=>e.preventDefault()}
            onDrop={dropLs}
          >
            {ls ? (
              <div className="placed lswitch" style={{position:'relative',width:'96%'}}>
                <div className="placed-head"><span className="placed-name">ls1</span><span className="placed-type">logical switch</span></div>
                <div className="placed-ip">10.0.1.0/24</div>
                <div className="placed-children" style={{flexDirection:'row',flexWrap:'wrap'}}>
                  {ports.p1 && (
                    <div className="placed-port" style={{borderColor:bound.p1?'var(--accent)':undefined,color:bound.p1?'var(--accent)':undefined,padding:'.2rem .4rem'}}>
                      ls1-port1 · 10.0.1.10 {bound.p1 && '⟶ ns-a'}
                    </div>
                  )}
                  {ports.p2 && (
                    <div className="placed-port" style={{borderColor:bound.p2?'var(--accent)':undefined,color:bound.p2?'var(--accent)':undefined,padding:'.2rem .4rem'}}>
                      ls1-port2 · 10.0.1.20 {bound.p2 && '⟶ ns-b'}
                    </div>
                  )}
                </div>
                {ls && (!ports.p1||!ports.p2) && (
                  <div
                    className="dropzone target"
                    style={{position:'relative',width:'100%',minHeight:40,marginTop:'.5rem'}}
                    onDragOver={(e)=>e.preventDefault()}
                    onDrop={(e)=>{
                      const piece = JSON.parse(e.dataTransfer.getData('application/json'));
                      if (piece.type==='lsp') dropPort(piece.which, e);
                    }}
                  >
                    <div className="dropzone-hint">drop logical ports here</div>
                  </div>
                )}
              </div>
            ) : (
              <>
                <div className="dropzone-label">drop ls1 here</div>
                <div className="dropzone-hint">declare the logical switch</div>
              </>
            )}
          </div>
        </div>
        
        {/* Two namespaces with bind buttons */}
        <div style={{position:'absolute',left:'6%',top:'58%',width:'42%'}}>
          <div className="placed namespace" style={{position:'relative',width:'100%'}}>
            <div className="placed-head"><span className="placed-name">ns-a</span><span className="placed-type">netns</span></div>
            <div className="placed-ip">veth-a · 10.0.1.10</div>
            <div className="placed-ip" style={{color:'var(--ink-mute)',fontSize:'.62rem'}}>peer: veth-a-ovs on br-int</div>
            {ports.p1 && !bound.p1 && (

/* ---------- Mission 10: Logical Router ---------- */
function Mission10({ onComplete, reset, term }) {
  const [router, setRouter] = useState(false);
  const [ifaces, setIfaces] = useState({ ls1:false, ls2:false });
  const [routes, setRoutes] = useState({ a:false, c:false });
  const [pinged, setPinged] = useState(false);
  
  useEffect(() => {
    setRouter(false); setIfaces({ls1:false,ls2:false}); setRoutes({a:false,c:false}); setPinged(false);
    term.reset([{text:'mission 10: drop a logical router, give it two interfaces, set default gateways, ping across.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const drop = (e) => {
    e.preventDefault();
    if (router) return;
    const piece = JSON.parse(e.dataTransfer.getData('application/json'));
    if (piece.type !== 'lrouter') return;
    setRouter(true);
    term.addAction('declaring logical router lr1');
    term.addCmd('ovn-nbctl lr-add lr1');
  };
  
  const addIface = (which) => {
    if (!router || ifaces[which]) return;
    const ip = which === 'ls1' ? '10.0.1.1' : '10.0.2.1';
    const mac = which === 'ls1' ? 'aa:bb:cc:00:01:01' : 'aa:bb:cc:00:01:02';
    setIfaces(i => ({ ...i, [which]: true }));
    term.addAction(`adding router interface lr1-${which} (${ip}/24)`);
    term.addCmd(`ovn-nbctl lrp-add lr1 lr1-${which} ${mac} ${ip}/24`);
    term.addCmd(`ovn-nbctl lsp-add ${which} ${which}-lr1`);
    term.addCmd(`ovn-nbctl lsp-set-type ${which}-lr1 router`);
    term.addCmd(`ovn-nbctl lsp-set-options ${which}-lr1 router-port=lr1-${which}`);
  };
  
  const addRoute = (k) => {
    if (routes[k]) return;
    const gw = k === 'a' ? '10.0.1.1' : '10.0.2.1';
    setRoutes(r => ({ ...r, [k]: true }));
    term.addAction(`setting default route inside ns-${k}`);
    term.addCmd(`sudo ip netns exec ns-${k} ip route add default via ${gw}`);
  };
  
  const ping = () => {
    if (!ifaces.ls1 || !ifaces.ls2 || !routes.a || !routes.c || pinged) return;
    setPinged(true);
    term.addDivider('cross-subnet ping ns-a (10.0.1.10) → ns-c (10.0.2.10)');
    term.addCmd('sudo ip netns exec ns-a ping -c 2 10.0.2.10');
    term.addOutput('64 bytes from 10.0.2.10: icmp_seq=1 ttl=63 time=0.52 ms');
    term.addOutput('64 bytes from 10.0.2.10: icmp_seq=2 ttl=63 time=0.48 ms');
    term.addOutput('(ttl=63 — one hop through lr1)');
    term.add('routing across two logical switches through a virtual router. Zero namespaces, zero iptables. Mission complete.', 'success');
    onComplete && onComplete();
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>OVN northbound</h4>
          {!router && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'lrouter'}))}>
              <div className="piece-icon router">LR</div>
              <div><div className="piece-name">lr1</div><div className="piece-desc">logical router</div></div>
            </div>
          )}
        </div>
        {router && (
          <div className="palette-group">
            <h4>Router interfaces</h4>
            {!ifaces.ls1 && (
              <div className="piece" onClick={()=>addIface('ls1')} style={{cursor:'pointer'}}>
                <div className="piece-icon router">I1</div>
                <div><div className="piece-name">attach to ls1</div><div className="piece-desc">10.0.1.1/24</div></div>
              </div>
            )}
            {!ifaces.ls2 && (
              <div className="piece" onClick={()=>addIface('ls2')} style={{cursor:'pointer'}}>
                <div className="piece-icon router">I2</div>
                <div><div className="piece-name">attach to ls2</div><div className="piece-desc">10.0.2.1/24</div></div>
              </div>
            )}
          </div>
        )}
        {router && ifaces.ls1 && ifaces.ls2 && (
          <div className="palette-group">
            <h4>Default routes</h4>
            {!routes.a && (
              <div className="piece" onClick={()=>addRoute('a')} style={{cursor:'pointer'}}>
                <div className="piece-icon ns">→</div>
                <div><div className="piece-name">ns-a default</div><div className="piece-desc">via 10.0.1.1</div></div>
              </div>
            )}
            {!routes.c && (
              <div className="piece" onClick={()=>addRoute('c')} style={{cursor:'pointer'}}>
                <div className="piece-icon ns">→</div>
                <div><div className="piece-name">ns-c default</div><div className="piece-desc">via 10.0.2.1</div></div>
              </div>
            )}
          </div>
        )}
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            An OVN logical router has no daemon, no namespace, no iptables. It's a set of logical flows on br-int that decrement TTL and rewrite MACs. Distributed routing — each chassis routes locally.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${pinged?'win':'live'}`}>
              <span className="dot"/>
              {pinged ? 'routing works' : 'build the router · attach to switches · set gateways'}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" onClick={ping} disabled={!router||!ifaces.ls1||!ifaces.ls2||!routes.a||!routes.c||pinged}>cross-subnet ping →</button>
          </div>
        </div>
        
        {/* ls1 on the left */}
        <div className="placed lswitch" style={{position:'absolute',left:'4%',top:'12%',width:'34%'}}>
          <div className="placed-head"><span className="placed-name">ls1</span><span className="placed-type">logical switch</span></div>
          <div className="placed-ip">10.0.1.0/24</div>
          <div className="placed-children">
            <div className="placed-child" style={{color:routes.a?'var(--accent)':'var(--ink-soft)'}}><span className="dot"/>ns-a · 10.0.1.10 {routes.a && '· gw=10.0.1.1'}</div>
            <div className="placed-child"><span className="dot"/>ns-b · 10.0.1.20</div>
          </div>
        </div>
        
        {/* router in middle */}
        <div
          className={`dropzone ${router?'':'target'}`}
          style={{ position:'absolute', left:'42%', top:'18%', width:'16%', height:'40%' }}
          onDragOver={(e)=>e.preventDefault()}
          onDrop={drop}
        >
          {router ? (
            <div className="placed lrouter" style={{position:'relative',width:'92%'}}>
              <div className="placed-head"><span className="placed-name">lr1</span><span className="placed-type">router</span></div>
              {ifaces.ls1 && <div className="placed-ip mono">lr1-ls1: 10.0.1.1/24</div>}
              {ifaces.ls2 && <div className="placed-ip mono">lr1-ls2: 10.0.2.1/24</div>}
            </div>
          ) : (
            <>
              <div className="dropzone-label">lr1 slot</div>
              <div className="dropzone-hint">drop router</div>
            </>
          )}
        </div>
        
        {/* ls2 on the right */}
        <div className="placed lswitch" style={{position:'absolute',right:'4%',top:'12%',width:'34%'}}>
          <div className="placed-head"><span className="placed-name">ls2</span><span className="placed-type">logical switch</span></div>
          <div className="placed-ip">10.0.2.0/24</div>
          <div className="placed-children">
            <div className="placed-child" style={{color:routes.c?'var(--accent)':'var(--ink-soft)'}}><span className="dot"/>ns-c · 10.0.2.10 {routes.c && '· gw=10.0.2.1'}</div>
            <div className="placed-child"><span className="dot"/>ns-d · 10.0.2.20</div>
          </div>
        </div>
        
        {/* OpenFlow note */}
        <div style={{position:'absolute',bottom:'4%',left:'8%',right:'8%',padding:'1rem 1.2rem',
          background:'rgba(167,139,250,.04)',border:'1px solid rgba(167,139,250,.2)',borderRadius:8,fontSize:'.8rem',color:'var(--ink-soft)'}}>
          <div style={{fontFamily:'Space Mono',fontSize:'.65rem',color:'var(--accent-3)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.3rem'}}>under the hood</div>
          The router never runs as a process. ovn-northd compiles lr1's interfaces into logical flows; ovn-controller realises them as OpenFlow on each chassis's br-int. A packet from ns-a to ns-c never leaves the kernel datapath.
        </div>
        
        {/* wires */}
        {router && (
          <svg className="wires-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            {ifaces.ls1 && <path d="M 380 250 L 470 250" className={`wire ${pinged?'active':''}`} strokeWidth="2.5"/>}
            {ifaces.ls2 && <path d="M 580 250 L 670 250" className={`wire ${pinged?'active':''}`} strokeWidth="2.5"/>}
          </svg>
        )}
      </div>
    </>
  );
}

/* ---------- Mission 11: ACL Time ---------- */
function Mission11({ onComplete, reset, term }) {
  const [acls, setAcls] = useState({ deny:false, icmp:false, ssh:false });
  const [tests, setTests] = useState({ icmp:false, ssh:false, http:false });
  
  useEffect(() => {
    setAcls({deny:false,icmp:false,ssh:false}); setTests({icmp:false,ssh:false,http:false});
    term.reset([{text:'mission 11: default-deny on ls1, allow ICMP and SSH, block everything else.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const dropAcl = (e) => {
    e.preventDefault();
    const p = JSON.parse(e.dataTransfer.getData('application/json'));
    if (p.type !== 'acl') return;
    if (acls[p.kind]) return;
    setAcls(a => ({ ...a, [p.kind]: true }));
    const lines = {
      deny: `ovn-nbctl acl-add ls1 from-lport 1000 'ip4' drop`,
      icmp: `ovn-nbctl acl-add ls1 from-lport 1100 'ip4 && icmp4' allow-related`,
      ssh:  `ovn-nbctl acl-add ls1 from-lport 1100 'ip4 && tcp && tcp.dst==22' allow-related`,
    };
    term.addAction(`installing ${p.kind} ACL on ls1`);
    term.addCmd(lines[p.kind]);
  };
  
  const test = (kind) => {
    setTests(t => ({ ...t, [kind]: true }));
    const allowedIcmp = acls.deny && acls.icmp;
    const allowedSsh = acls.deny && acls.ssh;
    if (kind === 'icmp') {
      term.addAction('ping (ICMP) test');
      term.addCmd('sudo ip netns exec ns-a ping -c 2 10.0.1.20');
      if (allowedIcmp) { term.addOutput('64 bytes from 10.0.1.20: time=0.4 ms'); term.add('ICMP allowed', 'success'); }
      else { term.addOutput('100% packet loss'); term.add('ICMP blocked', 'error'); }
    }
    if (kind === 'ssh') {
      term.addAction('TCP/22 (SSH) test');
      term.addCmd('sudo ip netns exec ns-a nc -zv 10.0.1.20 22');
      if (allowedSsh) { term.addOutput('Connection to 10.0.1.20 22 port [tcp/ssh] succeeded!'); term.add('SSH allowed', 'success'); }
      else { term.addOutput('Connection refused'); term.add('SSH blocked', 'error'); }
    }
    if (kind === 'http') {
      term.addAction('TCP/80 (HTTP) test');
      term.addCmd('sudo ip netns exec ns-a nc -zv 10.0.1.20 80');
      if (acls.deny) { term.addOutput('Connection refused'); term.add('HTTP blocked — by default-deny ACL', 'success'); }
      else { term.addOutput('Connection succeeded'); term.add('HTTP allowed (should have been blocked!)', 'error'); }
    }
  };
  
  useEffect(() => {
    const allDone = tests.icmp && tests.ssh && tests.http && acls.deny && acls.icmp && acls.ssh;
    if (allDone) {
      term.addDivider('summary');
      term.add('ICMP ✓ SSH ✓ HTTP ✗ — exactly the security-group posture you wanted. Mission complete.', 'success');
      onComplete && onComplete();
    }
  }, [tests, acls]);
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">palette</div>
        <div className="palette-group">
          <h4>ACL rules (drag in order)</h4>
          {!acls.deny && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'acl',kind:'deny'}))}>
              <div className="piece-icon acl">D</div>
              <div><div className="piece-name">priority=1000 · deny ip4</div><div className="piece-desc">drop everything</div></div>
            </div>
          )}
          {!acls.icmp && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'acl',kind:'icmp'}))}>
              <div className="piece-icon flow">I</div>
              <div><div className="piece-name">priority=1100 · allow icmp4</div><div className="piece-desc">stateful ICMP</div></div>
            </div>
          )}
          {!acls.ssh && (
            <div className="piece" draggable
              onDragStart={(e)=>e.dataTransfer.setData('application/json',JSON.stringify({type:'acl',kind:'ssh'}))}>
              <div className="piece-icon flow">S</div>
              <div><div className="piece-name">priority=1100 · allow tcp.dst==22</div><div className="piece-desc">stateful SSH</div></div>
            </div>
          )}
        </div>
        <div className="palette-group">
          <h4>Tests</h4>
          {[['icmp','ping ns-a → ns-b'],['ssh','TCP 22'],['http','TCP 80']].map(([k,n]) => (
            <div key={k} className="piece" onClick={()=>test(k)} style={{cursor:'pointer',borderColor:tests[k]?'var(--accent)':undefined}}>
              <div className="piece-icon ns">→</div>
              <div><div className="piece-name">{n}</div><div className="piece-desc">click to run</div></div>
            </div>
          ))}
        </div>
        <div className="palette-group" style={{marginTop:'auto'}}>
          <h4>Concept</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            OVN ACLs map directly to OpenStack security groups. They're enforced in OVS flows on br-int — no iptables, no kernel netfilter. <code style={{fontSize:'.85em'}}>allow-related</code> tracks connection state.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status live`}>
              <span className="dot"/>
              {Object.values(acls).filter(Boolean).length}/3 ACLs · {Object.values(tests).filter(Boolean).length}/3 tests
            </div>
          </div>
        </div>
        
        <div style={{position:'absolute',inset:'80px 40px 40px',display:'flex',flexDirection:'column',gap:'1rem'}}>
          <div style={{fontFamily:'Space Mono',fontSize:'.66rem',color:'var(--accent-3)',letterSpacing:'.1em',textTransform:'uppercase'}}>ls1 — ACL stack (highest priority evaluated first)</div>
          
          <div
            className="dropzone target"
            style={{position:'relative',width:'100%',minHeight:240,padding:'1rem',display:'flex',flexDirection:'column',alignItems:'stretch',justifyContent:'flex-start',gap:'.5rem'}}
            onDragOver={(e)=>e.preventDefault()}
            onDrop={dropAcl}
          >
            {acls.icmp && (
              <div className="placed flow" style={{position:'relative',width:'100%',borderColor:'var(--accent)'}}>
                <div className="placed-head"><span className="placed-name" style={{color:'var(--accent)'}}>priority=1100</span><span className="placed-type">allow-related</span></div>
                <div className="placed-ip mono">ip4 && icmp4 → allow-related (stateful)</div>
              </div>
            )}
            {acls.ssh && (
              <div className="placed flow" style={{position:'relative',width:'100%',borderColor:'var(--accent)'}}>
                <div className="placed-head"><span className="placed-name" style={{color:'var(--accent)'}}>priority=1100</span><span className="placed-type">allow-related</span></div>
                <div className="placed-ip mono">ip4 && tcp && tcp.dst==22 → allow-related</div>
              </div>
            )}
            {acls.deny && (
              <div className="placed flow" style={{position:'relative',width:'100%',borderColor:'var(--danger)'}}>
                <div className="placed-head"><span className="placed-name" style={{color:'var(--danger)'}}>priority=1000</span><span className="placed-type">default deny</span></div>
                <div className="placed-ip mono">ip4 → drop</div>
              </div>
            )}
            {!acls.deny && !acls.icmp && !acls.ssh && (
              <div style={{textAlign:'center',color:'var(--ink-mute)',padding:'2rem'}}>
                <div className="dropzone-label">drop ACL rules here</div>
                <div className="dropzone-hint" style={{marginTop:'.5rem'}}>drag all three — deny + ICMP + SSH</div>
              </div>
            )}
          </div>
          
          <div style={{padding:'.8rem 1rem',background:'rgba(255,184,73,.04)',border:'1px solid rgba(255,184,73,.2)',borderRadius:8,fontSize:'.78rem',color:'var(--accent-2)'}}>
            <strong>Why install deny last (visually) but at lower priority?</strong> Allow rules (1100) match before deny (1000). Default-deny is the safety net for anything that didn't match an allow.
          </div>
        </div>
      </div>
    </>
  );
}

/* ---------- Mission 12: Capstone Mapping (drag-to-match) ---------- */
function Mission12({ onComplete, reset, term }) {
  const PAIRS = [
    { id:'ls', ovn:'ovn-nbctl ls-add ls1', os:'openstack network create net1' },
    { id:'lsp', ovn:'ovn-nbctl lsp-add ls1 port1', os:'openstack port create --network net1 port1' },
    { id:'lr', ovn:'ovn-nbctl lr-add lr1', os:'openstack router create router1' },
    { id:'lrp', ovn:'ovn-nbctl lrp-add lr1 lr1-ls1 ...', os:'openstack router add subnet router1 sub1' },
    { id:'acl', ovn:'ovn-nbctl acl-add ls1 from-lport ...', os:'openstack security group rule create ...' },
    { id:'dhcp', ovn:'ovn-nbctl create DHCP_Options ...', os:'openstack subnet create --dhcp-enabled ...' },
  ];
  // shuffle OS labels initially
  const [shuffled] = useState(() => {
    const a = PAIRS.map(p => ({ id:p.id, text:p.os }));
    for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  });
  const [matches, setMatches] = useState({}); // {pairId: shuffledIdx}
  const [draggedCardId, setDraggedCardId] = useState(null);
  const [verified, setVerified] = useState(false);
  
  useEffect(() => {
    setMatches({}); setVerified(false);
    term.reset([{text:'mission 12: match each OVN command to the OpenStack CLI that calls it underneath.', type:'action', id:Math.random()}]);
  }, [reset]);
  
  const onSlotDrop = (pairId, e) => {
    e.preventDefault();
    const cardId = e.dataTransfer.getData('text/plain');
    if (!cardId) return;
    // already used elsewhere?
    if (Object.values(matches).includes(cardId)) {
      // remove from previous slot
      const prevSlot = Object.keys(matches).find(k => matches[k] === cardId);
      setMatches(m => { const n = {...m}; delete n[prevSlot]; n[pairId] = cardId; return n; });
    } else {
      setMatches(m => ({ ...m, [pairId]: cardId }));
    }
    term.addAction(`matched ${pairId}`);
  };
  
  const verify = () => {
    const allCorrect = PAIRS.every(p => matches[p.id] === p.id);
    if (allCorrect) {
      setVerified(true);
      term.addDivider('capstone verification');
      PAIRS.forEach(p => {
        term.add(`${p.ovn} ⟷ ${p.os}`, 'success');
      });
      term.add('every OpenStack networking action maps to OVN northbound. The Neutron OVN driver writes exactly the commands you wrote by hand. Workshop complete.', 'success');
      onComplete && onComplete();
    } else {
      const wrong = PAIRS.filter(p => matches[p.id] && matches[p.id] !== p.id).length;
      const missing = PAIRS.filter(p => !matches[p.id]).length;
      term.add(`${wrong} wrong · ${missing} unmatched. Try again.`, 'error');
    }
  };
  
  return (
    <>
      <div className="palette">
        <div className="panel-title">about</div>
        <div className="palette-group">
          <h4>Capstone</h4>
          <p style={{fontSize:'.82rem',color:'var(--ink-soft)',margin:0,lineHeight:1.5}}>
            You've now built — by hand — every primitive Neutron uses. Match each OVN command to the OpenStack CLI that produces it under the hood.
          </p>
        </div>
        <div className="palette-group">
          <h4>How it works in production</h4>
          <p style={{fontSize:'.78rem',color:'var(--ink-mute)',margin:0,lineHeight:1.5}}>
            When you run <code style={{fontSize:'.85em'}}>openstack network create</code>, Neutron's ML2/OVN mech driver invokes <code style={{fontSize:'.85em'}}>ovn-nbctl ls-add</code> on your behalf. Same for ports, routers, security groups, and DHCP.
          </p>
        </div>
      </div>
      <div className="canvas-wrap">
        <div className="canvas-toolbar">
          <div className="left">
            <div className={`canvas-status ${verified?'win':'live'}`}>
              <span className="dot"/>
              {verified ? 'all six matched' : `${Object.keys(matches).length}/6 matched`}
            </div>
          </div>
          <div className="right">
            <button className="btn btn-primary" onClick={verify} disabled={Object.keys(matches).length<6||verified}>verify mapping →</button>
          </div>
        </div>
        <div className="match-board" style={{marginTop:'60px'}}>
          <div className="match-col">
            <h3>OVN command (what you ran)</h3>
            {PAIRS.map(p => (
              <div
                key={p.id}
                className={`match-slot ${matches[p.id] ? (verified && matches[p.id]===p.id ? 'filled' : verified ? 'wrong' : 'filled') : 'target'}`}
                onDragOver={(e)=>e.preventDefault()}
                onDrop={(e)=>onSlotDrop(p.id,e)}
              >
                <div style={{flex:1}}>
                  <div className="match-slot-label">{p.id}</div>
                  <div style={{fontFamily:'Space Mono',fontSize:'.78rem',color:'var(--ink)'}}>{p.ovn}</div>
                </div>
                {matches[p.id] && (
                  <div style={{
                    marginLeft:'auto',padding:'.3rem .55rem',background:'var(--bg)',border:'1px solid var(--line-strong)',borderRadius:5,
                    fontFamily:'Space Mono',fontSize:'.72rem',color:verified&&matches[p.id]===p.id?'var(--accent)':verified?'var(--danger)':'var(--ink-soft)'
                  }}>
                    {shuffled.find(s=>s.id===matches[p.id])?.text}
                    <button style={{marginLeft:'.4rem',background:'transparent',border:'none',color:'var(--ink-mute)',cursor:'pointer'}}
                      onClick={()=>setMatches(m=>{const n={...m};delete n[p.id];return n;})}>×</button>
                  </div>
                )}
              </div>
            ))}
          </div>
          <div className="match-col">
            <h3>OpenStack equivalent (drag onto its OVN match)</h3>
            {shuffled.filter(s => !Object.values(matches).includes(s.id)).map(s => (
              <div
                key={s.id}
                className="match-card"
                draggable
                onDragStart={(e)=>{ e.dataTransfer.setData('text/plain', s.id); setDraggedCardId(s.id); }}
                onDragEnd={()=>setDraggedCardId(null)}
                style={{opacity:draggedCardId===s.id?0.4:1}}
              >
                {s.text}
              </div>
            ))}
            {shuffled.every(s => Object.values(matches).includes(s.id)) && (
              <div style={{textAlign:'center',color:'var(--ink-mute)',padding:'1rem',fontSize:'.82rem',fontStyle:'italic'}}>
                all cards matched — click "verify" above
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

    II:{ label:'tier II · open vswitch', desc:'Bridges, OpenFlow rules, MAC learning, VXLAN — programmable software switching.' },

  return (

        <p className="home-lede">

      <h2 style={{marginTop:'3rem',marginBottom:'1rem'}}>missions</h2>
      <div className="mission-grid">
        {MISSIONS.map(m => (
          <div key={m.id} className={`mission-card ${completed.has(m.id) ? 'done' : ''}`} onClick={() => onPick(m.id)}>
            <div className="mc-check"/>
            <div className="mc-num">mission {String(m.id).padStart(2,'0')}</div>
            <h3>{m.title}</h3>
            <p>{m.summary}</p>
            <div className="mc-foot">
              <span className="tag">tier {m.tier}</span>
              <span>· {m.tag}</span>
            </div>
          </div>
        ))}
      </div>
      
      <div style={{marginTop:'3rem',padding:'1.5rem',border:'1px solid var(--line)',borderRadius:8,
        background:'linear-gradient(180deg,var(--bg-elev),var(--bg))'}}>

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [active, setActive] = useState(null); // null = home, otherwise mission id
  const [completed, setCompleted] = useState(new Set());
  const [resetKey, setResetKey] = useState(0);
  const term = useTerminal([]);
  const [showCelebrate, setShowCelebrate] = useState(false);
  
  const onComplete = useCallback(() => {
    setCompleted(c => new Set([...c, active]));
    setTimeout(() => setShowCelebrate(true), 600);
  }, [active]);
  
  const goTo = (id) => {
    setActive(id);
    setShowCelebrate(false);
    setResetKey(k => k + 1);
    window.scrollTo({top:0,behavior:'smooth'});
  };
  
  const goHome = () => {
    setActive(null);
    setShowCelebrate(false);
    term.clear();
  };
  
  const reset = () => {
    setResetKey(k => k + 1);
    setShowCelebrate(false);
  };
  
  const nextMission = MISSIONS.find(m => m.id > (active || 0));
  
  if (active === null) {
    return <Home onPick={goTo} completed={completed} />;
  }
  
  const mission = MISSIONS.find(m => m.id === active);
  if (!mission) return <Home onPick={goTo} completed={completed} />;
  const Comp = mission.Comp;
  
  return (
    <div className="shell">
      <div className="topbar">
        <div className="logo" onClick={goHome} style={{cursor:'pointer'}}>
          <div className="logo-mark">/n</div>
          <div className="logo-text">netlab<small>ovs · ovn missions</small></div>
        </div>
        <div className="mission-tabs">
          {MISSIONS.map(m => (
            <button key={m.id} className={`tab ${active===m.id?'active':''} ${completed.has(m.id)?'done':''}`} onClick={()=>goTo(m.id)}>
              <span className="num">{String(m.id).padStart(2,'0')}</span>
              {m.title}
            </button>
          ))}
        </div>
        <div className="progress-pill">
          <strong>{completed.size}</strong>/{MISSIONS.length} complete
        </div>
      </div>
      
      <div className="mission">
        <div className="mission-head" style={{gridColumn:'1 / -1'}}>
          <div>
            <div className="mission-meta">
              <span className="badge">mission {String(mission.id).padStart(2,'0')}</span>
              <span className="tier">tier {mission.tier} · {mission.tag}</span>
            </div>
            <h1>{mission.title}</h1>
            <div className="lede">{mission.summary}</div>
          </div>
          <div className="mission-actions">
            <button className="btn btn-ghost" onClick={reset}>reset</button>
            <button className="btn btn-ghost" onClick={goHome}>← all missions</button>
          </div>
        </div>
        <Comp key={resetKey} onComplete={onComplete} reset={resetKey} term={term} />
        <div className="right-panel">
          <Terminal lines={term.lines} onCopy={() => term.add('(copied to clipboard)', 'success')} />
        </div>
      </div>
      
      {showCelebrate && (
        <div className="celebrate" onClick={()=>setShowCelebrate(false)}>
          <div className="celebrate-card" onClick={e=>e.stopPropagation()}>
            <div className="celebrate-icon">✓</div>
            <h2>mission {String(mission.id).padStart(2,'0')} complete</h2>
            <p>{mission.title.toLowerCase()} — {completed.size}/{MISSIONS.length} done</p>
            <div className="celebrate-actions">
              {nextMission ? (
                <button className="btn btn-primary" onClick={()=>goTo(nextMission.id)}>next: {nextMission.title.toLowerCase()} →</button>
              ) : (
                <button className="btn btn-primary" onClick={goHome}>workshop complete →</button>
              )}
              <button className="btn btn-ghost" onClick={()=>setShowCelebrate(false)}>stay here</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
